  { v: "active", l: "執行中", color: "#D97706", bg: "#FEF3C7" },
  { v: "done", l: "已完成", color: "#059669", bg: "#D1FAE5" },
  { v: "paused", l: "暫緩", color: "#9CA3AF", bg: "#F3F4F6" },
];
const LOG_STATUS = [
  { v: "todo", l: "待辦", color: "#9CA3AF", bg: "#F3F4F6" },
  { v: "active", l: "執行中", color: "#D97706", bg: "#FEF3C7" },
  { v: "done", l: "已完成", color: "#059669", bg: "#D1FAE5" },
  { v: "paused", l: "暫緩", color: "#6B7280", bg: "#F3F4F6" },
];
const LOG_CATS = [
  { v: "product", l: "商品", color: "#7C3AED" },
  { v: "material", l: "素材製作", color: "#0369A1" },
  { v: "report", l: "業績回報", color: "#059669" },
  { v: "social", l: "社群投放", color: "#D97706" },
  { v: "event", l: "活動執行", color: "#DC2626" },
  { v: "budget", l: "預算", color: "#6366F1" },
  { v: "meeting", l: "會議決議", color: "#0891B2" },
  { v: "other", l: "其他", color: "#6B7280" },
];

function MarketingPg({ mktg, setMktg }) {
  const [editId, setEditId] = React.useState(null);
  const [ef, setEf] = React.useState({});
  const [logEdit, setLogEdit] = React.useState({ stratId: null, logId: null, text: "", cat: "other", status: "todo", dueDate: "" });
  const [filterStatus, setFilterStatus] = React.useState("all");
  const [dlUrl, setDlUrl] = React.useState(null);
  const [dlName, setDlName] = React.useState("");
  const [copied, setCopied] = React.useState(false);

  const add = () => {
    setEf({
      id: "mk" + Date.now(), name: "", prodLine: "both", budget: "",
      status: "proposed", description: "", proposedDate: new Date().toISOString().slice(0, 10),
      logs: [],
    });
    setEditId("new");
  };

  const saveEdit = () => {
    if (editId === "new") { setMktg(p => [...p, ef]); }
    else { setMktg(p => p.map(m => m.id === editId ? ef : m)); }
    setEditId(null);
  };

  const rm = (id) => setMktg(p => p.filter(m => m.id !== id));

  const addLog = (stratId) => {
    const text = logEdit.text.trim();
    if (!text) return;
    setMktg(p => p.map(m => {
      if (m.id !== stratId) return m;
      return { ...m, logs: [...(m.logs || []), {
        id: "lg" + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        text: text,
        cat: logEdit.cat || "other",
        status: logEdit.status || "todo",
        dueDate: logEdit.dueDate || "",
        done: false,
      }] };
    }));
    setLogEdit({ stratId: null, logId: null, text: "", cat: "other", status: "todo", dueDate: "" });
  };

  const rmLog = (stratId, logId) => {
    setMktg(p => p.map(m => {
      if (m.id !== stratId) return m;
      return { ...m, logs: (m.logs || []).filter(l => l.id !== logId) };
    }));
  };

  const changeLogStatus = (stratId, logId, newStatus) => {
    setMktg(p => p.map(m => {
      if (m.id !== stratId) return m;
      return { ...m, logs: (m.logs || []).map(l => l.id === logId ? { ...l, status: newStatus, done: newStatus === "done" } : l) };
    }));
  };

  const toggleLog = (stratId, logId) => {
    setMktg(p => p.map(m => {
      if (m.id !== stratId) return m;
      return { ...m, logs: (m.logs || []).map(l => {
        if (l.id !== logId) return l;
        const newDone = !l.done;
        return { ...l, done: newDone, status: newDone ? "done" : "todo" };
      }) };
    }));
  };

  const saveLog = (stratId, logId) => {
    const text = logEdit.text.trim();
    if (!text) return;
    setMktg(p => p.map(m => {
      if (m.id !== stratId) return m;
      return { ...m, logs: (m.logs || []).map(l => l.id === logId ? { ...l, text: text, cat: logEdit.cat || l.cat, status: logEdit.status || l.status, dueDate: logEdit.dueDate !== undefined ? logEdit.dueDate : (l.dueDate || "") } : l) };
    }));
    setLogEdit({ stratId: null, logId: null, text: "", cat: "other", status: "todo", dueDate: "" });
  };

  const changeStatus = (id, newStatus) => {
    setMktg(p => p.map(m => m.id === id ? { ...m, status: newStatus } : m));
  };

  // CSV export existing logs for editing
  const dlCsvTemplate = () => {
    let csv = "\uFEFF紀錄ID,策略名稱,分類,項目說明,截止日,狀態\n";
    // Export all existing logs
    mktg.forEach(m => {
      (m.logs || []).forEach(l => {
        const catLabel = (LOG_CATS.find(c => c.v === (l.cat || "other")) || {}).l || "其他";
        const statusLabel = (LOG_STATUS.find(s => s.v === (l.status || "todo")) || {}).l || "待辦";
        const esc = (s) => '"' + String(s || "").replace(/"/g, '""') + '"';
        csv += esc(l.id) + "," + esc(m.name) + "," + esc(catLabel) + "," + esc(l.text) + "," + esc(l.dueDate || "") + "," + esc(statusLabel) + "\n";
      });
    });
    if (mktg.every(m => !(m.logs || []).length)) {
      csv += ",OMO開學季,素材製作,（範例）預算簽核,2026-05-30,待辦\n";
    }
    csv += "\n說明：\n";
    csv += "1. 紀錄ID 欄位不要動（用來比對更新）。新增的列請留空紀錄ID。\n";
    csv += "2. 分類可填：商品/素材製作/業績回報/社群投放/活動執行/預算/會議決議/其他\n";
    csv += "3. 狀態可填：待辦/執行中/已完成/暫緩\n";
    csv += "4. 截止日格式：2026-05-30\n";
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "行銷紀錄_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };

  // CSV import (6 columns: ID, strategy, cat, text, dueDate, status)
  const catMap = { "商品": "product", "素材製作": "material", "素材": "material", "業績回報": "report", "業績": "report", "社群投放": "social", "社群": "social", "活動執行": "event", "活動": "event", "預算": "budget", "會議決議": "meeting", "會議": "meeting", "其他": "other" };
  const statusMap = { "待辦": "todo", "執行中": "active", "已完成": "done", "暫緩": "paused" };

  const parseCsvRow = (line) => {
    const result = [];
    let current = "";
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = "";
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  };

  const importCsv = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result;
      const lines = text.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("說明") && !l.startsWith("1.") && !l.startsWith("2.") && !l.startsWith("3.") && !l.startsWith("4."));
      if (lines.length < 2) { alert("CSV 格式錯誤或無資料"); return; }

      const header = parseCsvRow(lines[0]);
      const hasId = header.length >= 6 && header[0].includes("ID");
      const updates = {}; // { stratName: [ { id?, text, cat, dueDate, status } ] }
      let addCount = 0, updateCount = 0;

      for (let i = 1; i < lines.length; i++) {
        const cols = parseCsvRow(lines[i]);
        if (cols.length < (hasId ? 4 : 3)) continue;

        let logId, stratName, cat, txt, dueDate, status;
        if (hasId) {
          logId = cols[0] || "";
          stratName = cols[1] || "";
          cat = cols[2] || "";
          txt = cols[3] || "";
          dueDate = cols[4] || "";
          status = cols[5] || "";
        } else {
          logId = "";
          stratName = cols[0] || "";
          cat = cols[1] || "";
          txt = cols[2] || "";
          dueDate = cols[3] || "";
          status = cols[4] || "";
        }

        if (!stratName || !txt) continue;
        if (!updates[stratName]) updates[stratName] = [];
        updates[stratName].push({
          logId: logId,
          text: txt,
          cat: catMap[cat] || "other",
          dueDate: dueDate,
          status: statusMap[status] || "todo",
        });
      }

      setMktg(prev => {
        let updated = [...prev];
        Object.entries(updates).forEach(([name, items]) => {
          const existingIdx = updated.findIndex(m => m.name === name);
          if (existingIdx >= 0) {
            const strat = { ...updated[existingIdx], logs: [...(updated[existingIdx].logs || [])] };
            items.forEach(item => {
              if (item.logId) {
                // Update existing log
                const logIdx = strat.logs.findIndex(l => l.id === item.logId);
                if (logIdx >= 0) {
                  strat.logs[logIdx] = { ...strat.logs[logIdx], text: item.text, cat: item.cat, dueDate: item.dueDate, status: item.status, done: item.status === "done" };
                  updateCount++;
                } else {
                  // ID not found, add as new
                  strat.logs.push({ id: "lg" + Date.now() + "_" + (addCount++), date: new Date().toISOString().slice(0, 10), text: item.text, cat: item.cat, dueDate: item.dueDate, status: item.status, done: item.status === "done" });
                }
              } else {
                // New log
                strat.logs.push({ id: "lg" + Date.now() + "_" + (addCount++), date: new Date().toISOString().slice(0, 10), text: item.text, cat: item.cat, dueDate: item.dueDate, status: item.status, done: item.status === "done" });
              }
            });
            updated[existingIdx] = strat;
          } else {
            // New strategy
            updated.push({
              id: "mk" + Date.now() + "_" + name.slice(0, 4),
              name: name,
              prodLine: "both",
              budget: "",
              status: "active",
              description: "",
              proposedDate: new Date().toISOString().slice(0, 10),
              logs: items.map((item, j) => ({
                id: "lg" + Date.now() + "_n" + j,
                date: new Date().toISOString().slice(0, 10),
                text: item.text,
                cat: item.cat,
                dueDate: item.dueDate,
                status: item.status,
                done: item.status === "done",
              })),
            });
            addCount += items.length;
          }
        });
        return updated;
      });

      alert("匯入完成！\n更新 " + updateCount + " 筆 ｜ 新增 " + addCount + " 筆");
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  // Marketing weekly items for this page's reminder
  const mktgWeekItems = React.useMemo(() => {
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const weekEnd = new Date(now); weekEnd.setDate(now.getDate() + (7 - now.getDay()));
    const nextStart = new Date(weekEnd); nextStart.setDate(nextStart.getDate() + 1);
    const nextEnd = new Date(nextStart); nextEnd.setDate(nextEnd.getDate() + 6);
    const build = (start, end) => {
      const list = [];
      mktg.forEach(m => {
        (m.logs || []).forEach(l => {
          if (l.dueDate && l.status !== "done") {
            const d = new Date(l.dueDate);
            if (d >= start && d <= end) {
              const lc = LOG_CATS.find(c => c.v === (l.cat || "other")) || LOG_CATS[LOG_CATS.length - 1];
              list.push({ ...l, stratName: m.name, stratId: m.id, catLabel: lc.l, catColor: lc.color, overdue: d < now });
            }
          }
        });
      });
      return list.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    };
    return { thisWeek: build(now, weekEnd), nextWeek: build(nextStart, nextEnd) };
  }, [mktg]);

  const [showNextMktg, setShowNextMktg] = React.useState(false);

  const filtered = mktg.filter(m => filterStatus === "all" || m.status === filterStatus);

  // Export biweekly report as HTML
  const exportReport = () => {
    const today = new Date();
    const yy = today.getFullYear() - 1911;
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");

    const active = mktg.filter(m => m.status !== "done" && m.status !== "paused");
    const completed = mktg.filter(m => m.status === "done");
    const paused = mktg.filter(m => m.status === "paused");

    const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");

    const buildRows = (list) => list.map(m => {
      const prod = m.prodLine === "both" ? "參+補" : m.prodLine === "ref" ? "參考書" : "補充";
      const st = (MKT_STATUS.find(s => s.v === m.status) || {}).l || "";
      const stColor = (MKT_STATUS.find(s => s.v === m.status) || {}).color || "#666";
      const logs = m.logs || [];
      const progress = logs.filter(l => l.status === "done" || l.status === "active").map(l => {
        const icon = l.status === "done" ? '<span style="color:#059669">✓</span>' : '<span style="color:#D97706">▸</span>';
        return icon + " " + esc(l.text);
      }).join("<br>") || '<span style="color:#ccc">—</span>';
      const todos = logs.filter(l => l.status === "todo" || l.status === "paused").map(l => {
        return "○ " + esc(l.text);
      }).join("<br>");
      return '<tr><td style="font-weight:600">' + esc(m.name) + '</td><td style="font-size:11px;color:#555">' + esc(m.description) + '</td><td style="text-align:center">' + prod + '</td><td style="text-align:center"><span style="color:' + stColor + ';font-weight:700">' + st + '</span></td><td style="text-align:center;font-size:11px">' + esc(m.budget) + '</td><td>' + progress + '</td>' + (todos ? '<td style="color:#666">' + todos + '</td>' : '<td style="color:#ccc">—</td>') + '</tr>';
    }).join("\n");

    let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>行銷雙週報 ' + yy + '/' + mm + '/' + dd + '</title>';
    html += '<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;padding:24px;background:#fff;color:#1a1a1a;font-size:13px}';
    html += 'h1{font-size:18px;margin-bottom:4px}h2{font-size:13px;color:#6b7280;margin:18px 0 8px;padding:6px 10px;background:#f3f4f6;border-radius:6px}';
    html += 'table{width:100%;border-collapse:collapse;margin-bottom:16px}th{background:#1B6B93;color:#fff;padding:8px 10px;text-align:left;font-size:12px;font-weight:600}';
    html += 'td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;font-size:12px;line-height:1.6}tr:hover{background:#f8fafc}';
    html += '.footer{margin-top:20px;font-size:11px;color:#9ca3af;text-align:center}';
    html += '@media print{body{padding:10px}h1{font-size:16px}td,th{font-size:11px;padding:5px 6px}}</style></head><body>';

    html += '<h1>115 行銷策略雙週報告</h1>';
    html += '<div style="font-size:12px;color:#6b7280;margin-bottom:16px">報告日期：' + yy + '/' + mm + '/' + dd + ' ｜ 策略數：' + mktg.length + ' ｜ 執行中：' + active.length + '</div>';

    const headers = '<thead><tr><th style="width:13%">策略名稱</th><th style="width:20%">策略說明</th><th style="width:6%">產品線</th><th style="width:6%">狀態</th><th style="width:7%">預算</th><th style="width:26%">最近進度</th><th style="width:22%">待辦事項</th></tr></thead>';

    if (active.length) {
      html += '<h2>▼ 執行中 / 已核准 / 提案中（' + active.length + '）</h2>';
      html += '<table>' + headers + '<tbody>' + buildRows(active) + '</tbody></table>';
    }
    if (completed.length) {
      html += '<h2>▼ 已完成（' + completed.length + '）</h2>';
      html += '<table>' + headers + '<tbody>' + buildRows(completed) + '</tbody></table>';
    }
    if (paused.length) {
      html += '<h2>▼ 暫緩（' + paused.length + '）</h2>';
      html += '<table>' + headers + '<tbody>' + buildRows(paused) + '</tbody></table>';
    }

    html += '<div class="footer">此報告由工作管理系統自動產生 ｜ 可直接列印（Ctrl+P）或全選複製貼到信件</div>';
    html += '</body></html>';

    const blob = new Blob([html], { type: "text/html;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const fname = "行銷雙週報_" + yy + mm + dd + ".html";
    setDlUrl(url);
    setDlName(fname);
    try { const a = document.createElement("a"); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); document.body.removeChild(a); } catch (e) {}
  };

  // Copy as email text
  const copyEmailText = () => {
    const today = new Date();
    const yy = today.getFullYear() - 1911;
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");

    let text = "115 行銷策略進度報告（" + yy + "/" + mm + "/" + dd + "）\n\n";

    const active = mktg.filter(m => m.status !== "done" && m.status !== "paused");
    const completed = mktg.filter(m => m.status === "done");

    if (active.length) {
      text += "━━ 進行中 ━━\n\n";
      active.forEach(m => {
        const prod = m.prodLine === "both" ? "[參+補]" : m.prodLine === "ref" ? "[參]" : "[補]";
        const st = (MKT_STATUS.find(s => s.v === m.status) || {}).l || "";
        text += "■ " + m.name + " " + prod + "（" + st + "）\n";
        if (m.budget) text += "  預算：" + m.budget + "\n";
        const logs = m.logs || [];
        const doneItems = logs.filter(l => l.status === "done");
        const activeItems = logs.filter(l => l.status === "active");
        const todoItems = logs.filter(l => l.status === "todo");
        if (doneItems.length) {
          doneItems.forEach(l => text += "  ✓ " + l.text + "\n");
        }
        if (activeItems.length) {
          activeItems.forEach(l => text += "  ▸ " + l.text + "\n");
        }
        if (todoItems.length) {
          text += "  【待辦】\n";
          todoItems.forEach(l => text += "  ○ " + l.text + "\n");
        }
        text += "\n";
      });
    }

    if (completed.length) {
      text += "━━ 已完成 ━━\n\n";
      completed.forEach(m => {
        text += "✓ " + m.name + "\n";
      });
      text += "\n";
    }

    text += "────\n以上報告，請參閱。\n";
    navigator.clipboard.writeText(text);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const statusCounts = {};
  MKT_STATUS.forEach(s => { statusCounts[s.v] = mktg.filter(m => m.status === s.v).length; });

  return (
    <div>
      {/* Stats */}
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {MKT_STATUS.map(s => (
          <div key={s.v} style={{ background: s.bg, borderRadius: 10, padding: "6px 12px", display: "flex", alignItems: "center", gap: 5, minWidth: 70 }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: s.color }}>{statusCounts[s.v] || 0}</div>
            <div style={{ fontSize: 9, color: s.color, fontWeight: 600 }}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* Filter + actions */}
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap", alignItems: "center" }}>
        <Pill label="全部" color="#6B7280" active={filterStatus === "all"} onClick={() => setFilterStatus("all")} small />
        {MKT_STATUS.map(s => (
          <Pill key={s.v} label={s.l} color={s.color} active={filterStatus === s.v} onClick={() => setFilterStatus(filterStatus === s.v ? "all" : s.v)} small />
        ))}
        <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
          <button onClick={(e) => { e.stopPropagation(); copyEmailText(); }} style={{ background: copied ? "#D1FAE5" : "#fff", border: "1.5px solid " + (copied ? "#059669" : "#E5E7EB"), borderRadius: 10, padding: "8px 16px", fontSize: 12, fontWeight: 700, cursor: "pointer", color: copied ? "#059669" : "#374151", transition: "all .2s" }}>
            {copied ? "✓ 已複製" : "📋 複製信件文字"}
          </button>
          <button onClick={(e) => { e.stopPropagation(); exportReport(); }} style={{ background: "#059669", color: "#fff", border: "none", borderRadius: 10, padding: "8px 16px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📥 匯出雙週報</button>
          <button onClick={(e) => { e.stopPropagation(); dlCsvTemplate(); }} style={{ background: "#fff", border: "1.5px solid #6366F1", color: "#6366F1", borderRadius: 10, padding: "8px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📄 匯出CSV</button>
          <label style={{ background: "#fff", border: "1.5px solid #D97706", color: "#D97706", borderRadius: 10, padding: "8px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📤 匯入CSV
            <input type="file" accept=".csv" style={{ display: "none" }} onChange={importCsv} />
          </label>
          <button onClick={add} style={{ background: A, color: "#fff", border: "none", borderRadius: 10, padding: "8px 16px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>＋ 新增策略</button>
        </div>
      </div>

      {/* Download link */}
      {dlUrl && (
        <div style={{ padding: "10px 14px", background: "#ECFDF5", borderRadius: 10, border: "1px solid #A7F3D0", marginBottom: 12 }}>
          <a href={dlUrl} download={dlName} target="_blank" rel="noreferrer" onClick={e => e.stopPropagation()} style={{ fontSize: 13, fontWeight: 700, color: "#059669", textDecoration: "underline" }}>📥 點此下載：{dlName}</a>
        </div>
      )}

      {/* Marketing weekly reminder */}
      {mktgWeekItems.thisWeek.length > 0 && (
        <div style={{ background: "#fff", borderRadius: 14, padding: "14px 18px", marginBottom: 10, border: mktgWeekItems.thisWeek.some(x => x.overdue) ? "1.5px solid #FECACA" : "1.5px solid #DBEAFE" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
            <span style={{ fontSize: 16 }}>⏰</span>
            <span style={{ fontSize: 13, fontWeight: 700, color: "#1E40AF" }}>本週行銷待辦</span>
            <span style={{ fontSize: 10, color: "#93C5FD", fontWeight: 600 }}>{mktgWeekItems.thisWeek.length} 項</span>
            {mktgWeekItems.thisWeek.filter(x => x.overdue).length > 0 && (
              <span style={{ fontSize: 10, fontWeight: 700, padding: "1px 8px", borderRadius: 8, background: "#FEE2E2", color: "#DC2626" }}>{mktgWeekItems.thisWeek.filter(x => x.overdue).length} 逾期</span>
            )}
          </div>
          {mktgWeekItems.thisWeek.map(it => (
            <div key={it.id} style={{ display: "flex", gap: 6, alignItems: "center", padding: "5px 8px", borderRadius: 8, marginBottom: 2, background: it.overdue ? "#FEF2F2" : "#FAFCFF" }}>
              <input type="checkbox" checked={false} onChange={() => changeLogStatus(it.stratId, it.id, "done")} style={{ width: 15, height: 15, cursor: "pointer", accentColor: "#059669" }} />
              <span style={{ fontSize: 9, fontWeight: 700, padding: "2px 6px", borderRadius: 8, background: it.catColor + "15", color: it.catColor }}>{it.catLabel}</span>
              <span style={{ fontSize: 11, fontWeight: 600, color: "#374151", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.text}</span>
              <span style={{ fontSize: 9, color: "#9CA3AF" }}>{it.stratName}</span>
              <span style={{ fontSize: 10, fontWeight: 700, color: it.dueDate ? dlColor(it.dueDate) : "#D1D5DB" }}>📅{it.dueDate}</span>
            </div>
          ))}
        </div>
      )}

      {mktgWeekItems.nextWeek.length > 0 && (
        <div style={{ background: "#fff", borderRadius: 14, padding: "14px 18px", marginBottom: 10, border: "1.5px solid #E0E7FF" }}>
          <button onClick={() => setShowNextMktg(!showNextMktg)} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", cursor: "pointer", padding: 0, width: "100%" }}>
            <span style={{ fontSize: 14 }}>📅</span>
            <span style={{ fontSize: 13, fontWeight: 700, color: "#4338CA" }}>下週行銷預覽</span>
            <span style={{ fontSize: 10, color: "#A5B4FC", fontWeight: 600 }}>{mktgWeekItems.nextWeek.length} 項</span>
            <span style={{ marginLeft: "auto", fontSize: 12, color: "#A5B4FC", transform: showNextMktg ? "rotate(90deg)" : "rotate(0)", transition: "transform .15s" }}>▶</span>
          </button>
          {showNextMktg && mktgWeekItems.nextWeek.map(it => (
            <div key={it.id} style={{ display: "flex", gap: 6, alignItems: "center", padding: "5px 8px", borderRadius: 8, marginTop: 4, background: "#FAFCFF" }}>
              <input type="checkbox" checked={false} onChange={() => changeLogStatus(it.stratId, it.id, "done")} style={{ width: 15, height: 15, cursor: "pointer", accentColor: "#059669" }} />
              <span style={{ fontSize: 9, fontWeight: 700, padding: "2px 6px", borderRadius: 8, background: it.catColor + "15", color: it.catColor }}>{it.catLabel}</span>
              <span style={{ fontSize: 11, fontWeight: 600, color: "#374151", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.text}</span>
              <span style={{ fontSize: 9, color: "#9CA3AF" }}>{it.stratName}</span>
              <span style={{ fontSize: 10, fontWeight: 700, color: "#D1D5DB" }}>📅{it.dueDate}</span>
            </div>
          ))}
        </div>
      )}

      {/* Strategy list */}
      {filtered.length === 0 && (
        <div style={{ textAlign: "center", padding: 40, color: "#D1D5DB" }}>
          <div style={{ fontSize: 36, marginBottom: 8 }}>📣</div>
          <div style={{ fontSize: 13 }}>尚無行銷策略，點「新增策略」開始</div>
        </div>
      )}

      {filtered.map(strat => {
        const st = MKT_STATUS.find(s => s.v === strat.status) || MKT_STATUS[0];
        const prods = strat.prodLine === "both" ? [PL.ref, PL.supp] : [PL[strat.prodLine]].filter(Boolean);
        const logs = strat.logs || [];
        return (
          <div key={strat.id} style={{ background: "#fff", borderRadius: 14, padding: "16px 18px", marginBottom: 8, border: "1px solid #F0F0F0" }}>
            {/* Header */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8, marginBottom: 8 }}>
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginBottom: 4 }}>
                  <span style={{ fontSize: 15, fontWeight: 700, color: "#1F2937" }}>{strat.name || "未命名策略"}</span>
                  {prods.map(p => <span key={p.label} style={{ fontSize: 9, fontWeight: 700, padding: "2px 7px", borderRadius: 6, background: p.bg, color: p.color }}>{p.label}</span>)}
                  <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 8px", borderRadius: 6, background: st.bg, color: st.color }}>{st.l}</span>
                  {strat.budget && <span style={{ fontSize: 10, color: "#6B7280" }}>💰 {strat.budget}</span>}
                </div>
                {strat.description && <div style={{ fontSize: 12, color: "#6B7280", lineHeight: 1.5 }}>{strat.description}</div>}
                <div style={{ fontSize: 10, color: "#D1D5DB", marginTop: 2 }}>提案：{strat.proposedDate}</div>
              </div>
              <div style={{ display: "flex", gap: 2, flexShrink: 0 }}>
                <IB onClick={() => { setEf({ ...strat }); setEditId(strat.id); }}>✏️</IB>
                <IB onClick={() => rm(strat.id)} danger>✕</IB>
              </div>
            </div>

            {/* Status quick-change */}
            <div style={{ display: "flex", gap: 4, marginBottom: 10 }}>
              {MKT_STATUS.map(s => (
                <button key={s.v} onClick={() => changeStatus(strat.id, s.v)} style={{
                  fontSize: 9, fontWeight: 600, padding: "3px 8px", borderRadius: 6, cursor: "pointer",
                  border: strat.status === s.v ? "1.5px solid " + s.color : "1px solid #E5E7EB",
                  background: strat.status === s.v ? s.bg : "#fff",
                  color: strat.status === s.v ? s.color : "#9CA3AF",
                }}>{s.l}</button>
              ))}
            </div>

            {/* Progress logs */}
            <div style={{ borderTop: "1px solid #F3F4F6", paddingTop: 8 }}>
              {(() => {
                // Group logs by month of dueDate (or "未排期")
                const grouped = {};
                logs.forEach(log => {
                  const dd = log.dueDate || "";
                  let key = "未排期";
                  if (dd) {
                    const d = new Date(dd);
                    key = d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0");
                  }
                  if (!grouped[key]) grouped[key] = [];
                  grouped[key].push(log);
                });
                // Sort month keys
                const keys = Object.keys(grouped).sort((a, b) => {
                  if (a === "未排期") return 1;
                  if (b === "未排期") return -1;
                  return a.localeCompare(b);
                });
                const todoCount = logs.filter(l => l.status === "todo").length;
                const doneCount = logs.filter(l => l.status === "done").length;
                const activeCount = logs.filter(l => l.status === "active").length;

                return (
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                      <span style={{ fontSize: 11, fontWeight: 700, color: "#6B7280" }}>📝 進度紀錄 ({logs.length})</span>
                      <span style={{ fontSize: 9, color: "#9CA3AF" }}>待辦 {todoCount} ｜ 執行 {activeCount} ｜ 完成 {doneCount}</span>
                    </div>
                    {logs.length === 0 && <div style={{ fontSize: 11, color: "#D1D5DB", fontStyle: "italic", marginBottom: 6 }}>尚無進度紀錄</div>}
                    {keys.map(monthKey => (
                      <div key={monthKey} style={{ marginBottom: 8 }}>
                        <div style={{ fontSize: 10, fontWeight: 700, color: "#94A3B8", padding: "4px 8px", background: "#F8FAFC", borderRadius: 6, marginBottom: 4 }}>
                          {monthKey === "未排期" ? "📌 未排期" : "📅 " + monthKey}
                          <span style={{ marginLeft: 6, fontWeight: 500 }}>({grouped[monthKey].length})</span>
                        </div>
                        {grouped[monthKey].map(log => {
                          const isEditing = logEdit.stratId === strat.id && logEdit.logId === log.id;
                          const lc = LOG_CATS.find(c => c.v === (log.cat || "other")) || LOG_CATS[LOG_CATS.length - 1];
                          const isDone = log.status === "done" || log.done;
                          const dc = log.dueDate ? dlColor(log.dueDate) : null;
                          return (
                            <div key={log.id} style={{ padding: "5px 0 5px 8px", borderBottom: "1px solid #FAFAFA", borderLeft: isDone ? "3px solid #D1FAE5" : log.status === "active" ? "3px solid #FEF3C7" : "3px solid #F3F4F6", opacity: isDone ? 0.5 : 1 }}>
                              {isEditing ? (
                                <div>
                                  <div style={{ display: "flex", gap: 4, marginBottom: 6 }}>
                                    <Inp value={logEdit.text} onChange={e => setLogEdit(p => ({ ...p, text: e.target.value }))}
                                      onKeyDown={e => { if (e.key === "Enter") saveLog(strat.id, log.id); if (e.key === "Escape") setLogEdit({ stratId: null, logId: null, text: "", cat: "other", status: "todo", dueDate: "" }); }}
                                      style={{ flex: 1, fontSize: 12, padding: "6px 10px" }} />
                                    <input type="date" value={logEdit.dueDate || ""} onChange={e => setLogEdit(p => ({ ...p, dueDate: e.target.value }))}
                                      style={{ padding: "4px 8px", border: "1.5px solid #E5E7EB", borderRadius: 6, fontSize: 11, outline: "none" }} />
                                    <button onClick={() => saveLog(strat.id, log.id)} style={{ background: "#059669", color: "#fff", border: "none", borderRadius: 6, padding: "4px 10px", fontSize: 10, fontWeight: 600, cursor: "pointer" }}>✓</button>
                                    <button onClick={() => setLogEdit({ stratId: null, logId: null, text: "", cat: "other", status: "todo", dueDate: "" })} style={{ background: "#F3F4F6", border: "none", borderRadius: 6, padding: "4px 8px", fontSize: 10, cursor: "pointer", color: "#6B7280" }}>✕</button>
                                  </div>
                                  <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                                    {LOG_CATS.map(c => (
                                      <button key={c.v} onClick={() => setLogEdit(p => ({ ...p, cat: c.v }))} style={{
                                        fontSize: 9, padding: "2px 7px", borderRadius: 10, cursor: "pointer",
                                        border: logEdit.cat === c.v ? "1.5px solid " + c.color : "1px solid #E5E7EB",
                                        background: logEdit.cat === c.v ? c.color + "15" : "#fff",
                                        color: logEdit.cat === c.v ? c.color : "#9CA3AF", fontWeight: 600,
                                      }}>{c.l}</button>
                                    ))}
                                  </div>
                                </div>
                              ) : (
                                <div style={{ display: "flex", gap: 6, alignItems: "flex-start" }}>
                                  <span style={{ fontSize: 9, fontWeight: 700, padding: "2px 6px", borderRadius: 8, background: lc.color + "15", color: lc.color, whiteSpace: "nowrap", marginTop: 1 }}>{lc.l}</span>
                                  <span onClick={() => setLogEdit({ stratId: strat.id, logId: log.id, text: log.text, cat: log.cat || "other", status: log.status || "todo", dueDate: log.dueDate || "" })}
                                    style={{ fontSize: 12, color: isDone ? "#9CA3AF" : "#374151", flex: 1, lineHeight: 1.5, cursor: "pointer", textDecoration: isDone ? "line-through" : "none" }}
                                    title="點擊編輯">{log.text}</span>
                                  {log.dueDate && <span style={{ fontSize: 9, fontWeight: 700, color: dc, whiteSpace: "nowrap", marginTop: 2 }}>📅{log.dueDate}</span>}
                                  <div style={{ display: "flex", gap: 2, flexShrink: 0 }}>
                                    {LOG_STATUS.map(s => (
                                      <button key={s.v} onClick={() => changeLogStatus(strat.id, log.id, s.v)} style={{
                                        fontSize: 8, fontWeight: 700, padding: "2px 5px", borderRadius: 5, cursor: "pointer",
                                        border: (log.status || "todo") === s.v ? "1.5px solid " + s.color : "1px solid #EFEFEF",
                                        background: (log.status || "todo") === s.v ? s.bg : "#fff",
                                        color: (log.status || "todo") === s.v ? s.color : "#D1D5DB",
                                      }}>{s.l}</button>
                                    ))}
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                );
              })()}

              {/* Add log */}
              <div style={{ marginTop: 8, padding: "10px 12px", background: "#FAFAFA", borderRadius: 10 }}>
                <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                  <Inp value={logEdit.stratId === strat.id && !logEdit.logId ? logEdit.text : ""}
                    onChange={e => setLogEdit(p => ({ ...p, stratId: strat.id, logId: null, text: e.target.value }))}
                    onFocus={() => { if (logEdit.stratId !== strat.id || logEdit.logId) setLogEdit({ stratId: strat.id, logId: null, text: "", cat: "other", status: "todo", dueDate: "" }); }}
                    placeholder="新增進度紀錄..." style={{ flex: 1, fontSize: 12 }}
                    onKeyDown={e => { if (e.key === "Enter") addLog(strat.id); if (e.key === "Escape") setLogEdit({ stratId: null, logId: null, text: "", cat: "other", status: "todo", dueDate: "" }); }} />
                  <button onClick={() => addLog(strat.id)} style={{ background: A, color: "#fff", border: "none", borderRadius: 8, padding: "6px 14px", fontSize: 11, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>＋</button>
                  {logEdit.stratId === strat.id && !logEdit.logId && logEdit.text && (
                    <button onClick={() => setLogEdit({ stratId: null, logId: null, text: "", cat: "other", status: "todo", dueDate: "" })} style={{ background: "#F3F4F6", border: "none", borderRadius: 8, padding: "6px 10px", fontSize: 11, cursor: "pointer", color: "#9CA3AF" }}>✕</button>
                  )}
                </div>
                {logEdit.stratId === strat.id && !logEdit.logId && (
                  <div>
                    <div style={{ display: "flex", gap: 6, marginBottom: 6, alignItems: "center" }}>
                      <span style={{ fontSize: 9, color: "#9CA3AF", fontWeight: 600 }}>截止日：</span>
                      <input type="date" value={logEdit.dueDate || ""} onChange={e => setLogEdit(p => ({ ...p, dueDate: e.target.value }))}
                        style={{ padding: "4px 8px", border: "1.5px solid #E5E7EB", borderRadius: 6, fontSize: 11, outline: "none" }} />
                    </div>
                    <div style={{ display: "flex", gap: 4, flexWrap: "wrap", alignItems: "center" }}>
                      <span style={{ fontSize: 9, color: "#9CA3AF", fontWeight: 600 }}>分類：</span>
                      {LOG_CATS.map(c => (
                        <button key={c.v} onClick={() => setLogEdit(p => ({ ...p, cat: c.v }))} style={{
                          fontSize: 9, padding: "2px 7px", borderRadius: 10, cursor: "pointer",
                          border: logEdit.cat === c.v ? "1.5px solid " + c.color : "1px solid #E5E7EB",
                          background: logEdit.cat === c.v ? c.color + "15" : "#fff",
                          color: logEdit.cat === c.v ? c.color : "#9CA3AF", fontWeight: 600,
                        }}>{c.l}</button>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      })}

      {/* Editor modal */}
      <Modal open={!!editId} onClose={() => setEditId(null)} title={editId === "new" ? "新增行銷策略" : "編輯策略"} width={480}>
        <FW><FL>策略名稱</FL><Inp value={ef.name || ""} onChange={e => setEf(p => ({ ...p, name: e.target.value }))} placeholder="例：115門市海報推廣" /></FW>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
          <div><FL>產品線</FL><Sel value={ef.prodLine || "both"} onChange={v => setEf(p => ({ ...p, prodLine: v }))} options={[{ v: "ref", l: "📘 參考書" }, { v: "supp", l: "📙 版版補充" }, { v: "both", l: "📘📙 兩者" }]} /></div>
          <div><FL>狀態</FL><Sel value={ef.status || "proposed"} onChange={v => setEf(p => ({ ...p, status: v }))} options={MKT_STATUS.map(s => ({ v: s.v, l: s.l }))} /></div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
          <div><FL>預算</FL><Inp value={ef.budget || ""} onChange={e => setEf(p => ({ ...p, budget: e.target.value }))} placeholder="例：NT$50,000" /></div>
          <div><FL>提案日期</FL><input type="date" value={ef.proposedDate || ""} onChange={e => setEf(p => ({ ...p, proposedDate: e.target.value }))} style={{ width: "100%", padding: "8px 12px", border: "1.5px solid #E5E7EB", borderRadius: 10, fontSize: 13, outline: "none", boxSizing: "border-box" }} /></div>
        </div>
        <FW><FL>策略說明</FL>
          <textarea value={ef.description || ""} onChange={e => setEf(p => ({ ...p, description: e.target.value }))} placeholder="策略內容、目標、執行方式..."
            style={{ width: "100%", padding: "8px 12px", border: "1.5px solid #E5E7EB", borderRadius: 10, fontSize: 13, minHeight: 70, resize: "vertical", boxSizing: "border-box", outline: "none", fontFamily: F }} />
        </FW>
        <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 10, borderTop: "1px solid #F3F4F6" }}>
          <div>{editId !== "new" && <button onClick={() => { rm(editId); setEditId(null); }} style={{ background: "none", border: "1.5px solid #EF4444", color: "#EF4444", borderRadius: 10, padding: "7px 16px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>刪除</button>}</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setEditId(null)} style={{ background: "#F3F4F6", border: "none", borderRadius: 10, padding: "7px 18px", fontSize: 12, fontWeight: 600, cursor: "pointer", color: "#6B7280" }}>取消</button>
            <button onClick={saveEdit} style={{ background: A, color: "#fff", border: "none", borderRadius: 10, padding: "7px 22px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>儲存</button>
          </div>
        </div>
      </Modal>
    </div>
  );
}

/* ═══════ MEMO PAGE 📓 ═══════ */
function MemoPg({ memos, setMemos }) {
  const [activeId, setActiveId] = React.useState(null);
  const [search, setSearch] = React.useState("");
  const [copied, setCopied] = React.useState(null);

  const add = () => {
    const n = { id: "mm" + Date.now(), title: "新備忘錄", content: "", createdAt: new Date().toISOString().slice(0, 10), updatedAt: new Date().toISOString().slice(0, 10) };
    setMemos(p => [n, ...p]);
    setActiveId(n.id);
  };

  const update = (id, field, value) => {
    setMemos(p => p.map(m => m.id === id ? { ...m, [field]: value, updatedAt: new Date().toISOString().slice(0, 10) } : m));
  };

  const rm = (id) => {
    setMemos(p => p.filter(m => m.id !== id));
    if (activeId === id) setActiveId(null);
  };

  const copyAll = (memo) => {
    const text = memo.title + "\n" + (memo.createdAt ? "建立：" + memo.createdAt + "\n" : "") + "────\n" + memo.content;
    navigator.clipboard.writeText(text);
    setCopied(memo.id);
    setTimeout(() => setCopied(null), 1500);
  };

  const dlMemo = (memo) => {
    const text = memo.title + "\n建立：" + memo.createdAt + "\n更新：" + memo.updatedAt + "\n────────────\n" + memo.content;
    const blob = new Blob(["\uFEFF" + text], { type: "text/plain;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (memo.title || "備忘錄") + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  const dlAll = () => {
    let text = "所有備忘錄匯出\n" + new Date().toISOString().slice(0, 10) + "\n";
    text += "════════════════════\n\n";
    memos.forEach((m, i) => {
      text += "【" + (i + 1) + "】" + m.title + "\n";
      text += "建立：" + m.createdAt + " ｜ 更新：" + m.updatedAt + "\n";
      text += "────────────\n";
      text += m.content + "\n\n";
    });
    const blob = new Blob(["\uFEFF" + text], { type: "text/plain;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "備忘錄匯出_" + new Date().toISOString().slice(0, 10) + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  const filtered = memos.filter(m => {
    if (!search) return true;
    return (m.title + m.content).toLowerCase().includes(search.toLowerCase());
  });

  const activeMemo = activeId ? memos.find(m => m.id === activeId) : null;

  return (
    <div style={{ display: "flex", gap: 12, minHeight: 500 }}>
      {/* Sidebar - memo list */}
      <div style={{ width: 240, flexShrink: 0 }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
          <button onClick={add} style={{ background: A, color: "#fff", border: "none", borderRadius: 10, padding: "8px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", flex: 1 }}>＋ 新備忘錄</button>
          {memos.length > 0 && <button onClick={dlAll} style={{ background: "#fff", border: "1.5px solid #E5E7EB", borderRadius: 10, padding: "8px 10px", fontSize: 11, cursor: "pointer", color: "#6B7280", fontWeight: 600 }}>📥</button>}
        </div>
        <Inp value={search} onChange={e => setSearch(e.target.value)} placeholder="🔍 搜尋..." style={{ marginBottom: 10, fontSize: 12 }} />

        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {filtered.length === 0 && <div style={{ fontSize: 12, color: "#D1D5DB", textAlign: "center", padding: 20, fontStyle: "italic" }}>沒有備忘錄</div>}
          {filtered.map(memo => (
            <button key={memo.id} onClick={() => setActiveId(memo.id)} style={{
              background: activeId === memo.id ? A + "12" : "#fff",
              border: activeId === memo.id ? "1.5px solid " + A : "1px solid #F0F0F0",
              borderRadius: 10, padding: "10px 12px", cursor: "pointer", textAlign: "left",
            }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#1F2937", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{memo.title || "未命名"}</div>
              <div style={{ fontSize: 10, color: "#9CA3AF", marginTop: 3 }}>{memo.updatedAt}</div>
              <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {memo.content ? memo.content.slice(0, 40) + (memo.content.length > 40 ? "..." : "") : "空白"}
              </div>
            </button>
          ))}
        </div>
      </div>

      {/* Main editor */}
      <div style={{ flex: 1, minWidth: 0 }}>
        {!activeMemo ? (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100%", color: "#D1D5DB" }}>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 48, marginBottom: 8 }}>📓</div>
              <div style={{ fontSize: 14 }}>選擇一則備忘錄，或新增一則</div>
            </div>
          </div>
        ) : (
          <div style={{ background: "#fff", borderRadius: 14, border: "1px solid #F0F0F0", height: "100%", display: "flex", flexDirection: "column" }}>
            {/* Title bar */}
            <div style={{ padding: "12px 16px", borderBottom: "1px solid #F3F4F6", display: "flex", alignItems: "center", gap: 8 }}>
              <input value={activeMemo.title} onChange={e => update(activeMemo.id, "title", e.target.value)}
                style={{ flex: 1, border: "none", outline: "none", fontSize: 16, fontWeight: 700, color: "#1F2937", fontFamily: F, background: "transparent" }}
                placeholder="備忘錄標題..." />
              <button onClick={(e) => { e.stopPropagation(); copyAll(activeMemo); }}
                style={{ background: copied === activeMemo.id ? "#D1FAE5" : "#F3F4F6", border: "none", borderRadius: 8, padding: "6px 12px", fontSize: 11, fontWeight: 600, cursor: "pointer", color: copied === activeMemo.id ? "#059669" : "#6B7280", transition: "all .2s" }}>
                {copied === activeMemo.id ? "✓ 已複製" : "📋 複製全文"}
              </button>
              <button onClick={(e) => { e.stopPropagation(); dlMemo(activeMemo); }}
                style={{ background: "#F3F4F6", border: "none", borderRadius: 8, padding: "6px 12px", fontSize: 11, fontWeight: 600, cursor: "pointer", color: "#6B7280" }}>
                📥 下載
              </button>
              <IB onClick={() => { if (confirm("確定刪除此備忘錄？")) rm(activeMemo.id); }} danger title="刪除">🗑</IB>
            </div>
            {/* Meta */}
            <div style={{ padding: "6px 16px", fontSize: 10, color: "#BCBCBC", display: "flex", gap: 12 }}>
              <span>建立：{activeMemo.createdAt}</span>
              <span>更新：{activeMemo.updatedAt}</span>
              <span>{activeMemo.content ? activeMemo.content.length + " 字" : "空白"}</span>
            </div>
            {/* Content */}
            <textarea
              value={activeMemo.content}
              onChange={e => update(activeMemo.id, "content", e.target.value)}
              placeholder="自由輸入文字、想法、問題、靈感...&#10;&#10;寫完可以按「複製全文」貼到 Gemini / ChatGPT 處理"
              style={{
                flex: 1, padding: "14px 16px", border: "none", outline: "none", resize: "none",
                fontSize: 14, lineHeight: 1.8, color: "#374151", fontFamily: F,
                background: "transparent", borderRadius: "0 0 14px 14px",
              }} />
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════ MAIN APP ═══════ */
function App() {
  const [tasks, setTasks] = React.useState([]);
  const [todos, setTodos] = React.useState([]);
  const [tools, setTools] = React.useState([]);
  const [notes, setNotes] = React.useState([]);
  const [mktg, setMktg] = React.useState([]);
  const [memos, setMemos] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [page, setPage] = React.useState("dashboard");
  const [selM, setSelM] = React.useState(new Date().getMonth());
  const [fP, setFP] = React.useState("all");
  const [fC, setFC] = React.useState("all");
  const [editTask, setEditTask] = React.useState(null);
  const [isNew, setIsNew] = React.useState(false);
  const [showReport, setShowReport] = React.useState(false);
  const [showClone, setShowClone] = React.useState(false);
  const [showData, setShowData] = React.useState(false);
  const [showPA, setShowPA] = React.useState(false);
  const [zoom, setZoom] = React.useState(1.15);
  const [ghCfg, setGhCfg] = React.useState(null);
  const [ghStatus, setGhStatus] = React.useState("off"); // off | ok | syncing | error
  const [showCloud, setShowCloud] = React.useState(false);
  const [ghForm, setGhForm] = React.useState({ owner: "", repo: "", token: "" });

  React.useEffect(() => {
    (async () => {
      const [t, td, tl, nt, zm, mk, me] = await Promise.all([sLoad("wv5t"), sLoad("wv5d"), sLoad("wv5l"), sLoad("wv5n"), sLoad("wv5z"), sLoad("wv5m"), sLoad("wv5me")]);
      setTasks(t || defTasks());
      setTodos(td || []);
      setTools(tl || []);
      setNotes(nt || []);
      setMktg(mk || []);
      setMemos(me || []);
      if (zm) setZoom(zm);
      // Load GitHub config
      const gc = await ghLoadCfg();
      if (gc && gc.token) {
        setGhCfg(gc);
        setGhForm(gc);
        setGhStatus("ok");
      }
      setLoading(false);
    })();
  }, []);

  React.useEffect(() => { if (!loading) sSave("wv5t", tasks); }, [tasks, loading]);
  React.useEffect(() => { if (!loading) sSave("wv5d", todos); }, [todos, loading]);
  React.useEffect(() => { if (!loading) sSave("wv5l", tools); }, [tools, loading]);
  React.useEffect(() => { if (!loading) sSave("wv5n", notes); }, [notes, loading]);
  React.useEffect(() => { if (!loading) sSave("wv5m", mktg); }, [mktg, loading]);
  React.useEffect(() => { if (!loading) sSave("wv5me", memos); }, [memos, loading]);
  React.useEffect(() => { if (!loading) sSave("wv5z", zoom); }, [zoom, loading]);

  // Cloud sync
  const syncTimerRef = React.useRef(null);

  const doCloudPush = React.useCallback(() => {
    if (!ghCfg || !ghCfg.token) return;
    if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
    syncTimerRef.current = setTimeout(async () => {
      setGhStatus("syncing");
      try {
        await ghPush(ghCfg, { tasks, todos, tools, notes, mktg, memos, v: "v5", syncAt: new Date().toISOString() });
        setGhStatus("ok");
      } catch (e) {
        console.error("Cloud sync error:", e);
        setGhStatus("error");
      }
    }, 3000);
  }, [ghCfg, tasks, todos, tools, notes, mktg, memos]);

  React.useEffect(() => { if (!loading && ghCfg) doCloudPush(); }, [tasks, todos, tools, notes, mktg, memos, loading]);

  const cloudPull = async () => {
    if (!ghCfg) return;
    setGhStatus("syncing");
    try {
      const d = await ghPull(ghCfg);
      if (d) {
        if (d.tasks) setTasks(d.tasks);
        if (d.todos) setTodos(d.todos);
        if (d.tools) setTools(d.tools);
        if (d.notes) setNotes(d.notes);
        if (d.mktg) setMktg(d.mktg);
        if (d.memos) setMemos(d.memos);
        setGhStatus("ok");
        alert("雲端資料已下載！");
      } else {
        setGhStatus("ok");
        alert("雲端尚無資料");
      }
    } catch (e) { setGhStatus("error"); alert("下載失敗：" + e.message); }
  };

  const cloudSaveConfig = async () => {
    if (!ghForm.owner || !ghForm.repo || !ghForm.token) { alert("請填寫完整"); return; }
    setGhStatus("syncing");
    try {
      const r = await fetch("https://api.github.com/repos/" + ghForm.owner + "/" + ghForm.repo, { headers: { Authorization: "token " + ghForm.token } });
      if (!r.ok) throw new Error("連線失敗，請檢查帳號/Repo/Token");
      await ghSaveCfg(ghForm);
      setGhCfg(ghForm);
      setGhStatus("ok");
      setShowCloud(false);
      await ghPush(ghForm, { tasks, todos, tools, notes, mktg, memos, v: "v5", syncAt: new Date().toISOString() });
      alert("連線成功！資料已上傳。");
    } catch (e) { setGhStatus("error"); alert(e.message); }
  };

  const cloudDisconnect = async () => {
    await window.storage.delete(GH_KEY);
    setGhCfg(null); setGhStatus("off"); setGhForm({ owner: "", repo: "", token: "" }); setShowCloud(false);
  };

  const toggle = React.useCallback(id => setTasks(p => p.map(t => t.id === id ? { ...t, status: STC[(STC.indexOf(t.status) + 1) % 3] } : t)), []);
  const saveTask = React.useCallback(u => setTasks(p => { const ex = p.find(t => t.id === u.id); return ex ? p.map(t => t.id === u.id ? u : t) : [...p, u]; }), []);
  const delTask = React.useCallback(id => setTasks(p => p.filter(t => t.id !== id)), []);

  const openNew = () => {
    setEditTask({ id: "t" + Date.now(), month: selM, category: "project", product: "both", title: "", status: "pending", note: "", url: "", aiTool: null, exp: "", subs: [] });
    setIsNew(true);
  };

  const filtered = React.useMemo(() => tasks.filter(t => {
    if (t.month !== selM) return false;
    if (fP !== "all" && t.product !== fP && t.product !== "both") return false;
    if (fC !== "all" && t.category !== fC) return false;
    return true;
  }), [tasks, selM, fP, fC]);

  const grouped = React.useMemo(() => {
    const g = {};
    Object.keys(CATS).forEach(k => { g[k] = []; });
    filtered.forEach(t => { if (g[t.category]) g[t.category].push(t); });
    return g;
  }, [filtered]);

  const mSt = React.useMemo(() => {
    const m = tasks.filter(t => t.month === selM);
    const d = m.filter(t => t.status === "done").length;
    const i = m.filter(t => t.status === "inProgress").length;
    return { total: m.length, done: d, ip: i, pd: m.length - d - i };
  }, [tasks, selM]);

  const ySt = React.useMemo(() => {
    const d = tasks.filter(t => t.status === "done").length;
    return { total: tasks.length, done: d, pct: tasks.length ? Math.round(d / tasks.length * 100) : 0 };
  }, [tasks]);

  const mC = React.useMemo(() => MONTHS.map((_, mi) => {
    const m = tasks.filter(t => t.month === mi);
    const d = m.filter(t => t.status === "done").length;
    return { total: m.length, done: d, pct: m.length ? Math.round(d / m.length * 100) : 0 };
  }), [tasks]);

  if (loading) {
    return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", fontFamily: F }}>⏳ 載入中...</div>;
  }

  const todoCount = todos.filter(t => !t.done).length;

  return (
    <div style={{ fontFamily: F, background: "#F5F3EE", minHeight: "100vh", color: "#1A1A1A", zoom: zoom }}>
      

      {/* HEADER */}
      <div style={{ background: "linear-gradient(140deg, #0D1B2A 0%, #1B2838 40%, #1B6B93 100%)", padding: "14px 20px 0", color: "#fff" }}>
        <div style={{ maxWidth: 1100, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8, paddingBottom: 8 }}>
            <div>
              <h1 style={{ margin: 0, fontSize: 19, fontWeight: 900 }}>參考書、版版補充教材 — 115 年度工作管理系統</h1>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {/* Zoom controls */}
              <div style={{ display: "flex", alignItems: "center", gap: 2, background: "rgba(255,255,255,0.1)", borderRadius: 8, padding: "3px 4px" }}>
                <button onClick={() => setZoom(z => Math.max(0.85, +(z - 0.1).toFixed(2)))} style={{ background: "none", border: "none", color: "#fff", cursor: "pointer", fontSize: 14, padding: "2px 6px", borderRadius: 4 }}
                  onMouseOver={e => e.currentTarget.style.background = "rgba(255,255,255,0.15)"}
                  onMouseOut={e => e.currentTarget.style.background = "none"}>−</button>
                <span style={{ fontSize: 10, fontWeight: 700, color: "#fff", minWidth: 36, textAlign: "center" }}>{Math.round(zoom * 100)}%</span>
                <button onClick={() => setZoom(z => Math.min(1.6, +(z + 0.1).toFixed(2)))} style={{ background: "none", border: "none", color: "#fff", cursor: "pointer", fontSize: 14, padding: "2px 6px", borderRadius: 4 }}
                  onMouseOver={e => e.currentTarget.style.background = "rgba(255,255,255,0.15)"}
                  onMouseOut={e => e.currentTarget.style.background = "none"}>+</button>
              </div>
              <button onClick={() => setShowPA(true)} style={{ background: "rgba(255,255,255,0.1)", border: "none", borderRadius: 8, padding: "5px 10px", fontSize: 10, color: "#fff", cursor: "pointer", fontWeight: 600 }}>⚡ PA</button>
              <button onClick={() => setShowCloud(true)} style={{ background: ghStatus === "ok" ? "rgba(52,211,153,0.2)" : ghStatus === "error" ? "rgba(239,68,68,0.2)" : "rgba(255,255,255,0.1)", border: "none", borderRadius: 8, padding: "5px 10px", fontSize: 10, color: "#fff", cursor: "pointer", fontWeight: 600 }}>
                {ghStatus === "syncing" ? "⏳" : ghStatus === "ok" ? "☁️✓" : ghStatus === "error" ? "☁️✗" : "☁️"}{" "}雲端
              </button>
              <button onClick={() => setShowData(true)} style={{ background: "rgba(255,255,255,0.1)", border: "none", borderRadius: 8, padding: "5px 10px", fontSize: 10, color: "#fff", cursor: "pointer", fontWeight: 600 }}>💾</button>
              <div style={{ display: "flex", alignItems: "center", gap: 6, background: "rgba(255,255,255,0.07)", borderRadius: 10, padding: "5px 10px" }}>
                <div style={{ position: "relative", width: 32, height: 32 }}>
                  <svg width="32" height="32" viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="13" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="3" />
                    <circle cx="16" cy="16" r="13" fill="none" stroke="#34D399" strokeWidth="3"
                      strokeDasharray={ySt.pct * 0.817 + " 81.7"} strokeLinecap="round" transform="rotate(-90 16 16)" />
                  </svg>
                  <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 800 }}>{ySt.pct}%</div>
                </div>
                <div>
                  <div style={{ fontSize: 8, opacity: 0.5 }}>年度</div>
                  <div style={{ fontSize: 10, fontWeight: 600 }}>{ySt.done}/{ySt.total}</div>
                </div>
              </div>
            </div>
          </div>

          {/* TABS */}
          <div style={{ display: "flex", gap: 1 }}>
            {[{ id: "dashboard", l: "📊 排程" }, { id: "todo", l: "📝 待辦" }, { id: "mktg", l: "📣 行銷" }, { id: "memo", l: "📓 備忘錄" }, { id: "notes", l: "📋 備註事項" }, { id: "tools", l: "🧰 工具" }].map(tab => (
              <button key={tab.id} onClick={() => setPage(tab.id)} style={{
                background: page === tab.id ? "rgba(255,255,255,0.15)" : "transparent",
                color: "#fff", border: "none", borderRadius: "8px 8px 0 0",
                padding: "6px 14px", fontSize: 11, fontWeight: page === tab.id ? 700 : 500,
                cursor: "pointer", borderBottom: page === tab.id ? "2px solid #34D399" : "2px solid transparent",
              }}>
                {tab.l}
                {tab.id === "todo" && todoCount > 0 && <span style={{ marginLeft: 4, background: "#EF4444", color: "#fff", fontSize: 8, fontWeight: 700, padding: "1px 5px", borderRadius: 8 }}>{todoCount}</span>}
                {tab.id === "mktg" && mktg.filter(m => m.status === "active").length > 0 && <span style={{ marginLeft: 4, background: "#D97706", color: "#fff", fontSize: 8, fontWeight: 700, padding: "1px 5px", borderRadius: 8 }}>{mktg.filter(m => m.status === "active").length}</span>}
                {tab.id === "memo" && memos.length > 0 && <span style={{ marginLeft: 4, fontSize: 8, opacity: 0.6 }}>{memos.length}</span>}
                {tab.id === "notes" && notes.filter(n => n.trackDate && !n.tracked).length > 0 && <span style={{ marginLeft: 4, background: "#D97706", color: "#fff", fontSize: 8, fontWeight: 700, padding: "1px 5px", borderRadius: 8 }}>{notes.filter(n => n.trackDate && !n.tracked).length}</span>}
                {tab.id === "tools" && tools.length > 0 && <span style={{ marginLeft: 4, fontSize: 8, opacity: 0.6 }}>{tools.length}</span>}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* CONTENT */}
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "14px 16px" }}>
        {page === "todo" && (
          <div>
            <WeeklyReminder tasks={tasks} todos={todos} notes={notes} mktg={mktg} setTasks={setTasks} setTodos={setTodos} setNotes={setNotes} setMktg={setMktg} />
            <TodoPg todos={todos} setTodos={setTodos} tasks={tasks} setTasks={setTasks} />
          </div>
        )}
        {page === "notes" && <ProductNotesPg notes={notes} setNotes={setNotes} setTodos={setTodos} />}
        {page === "mktg" && <MarketingPg mktg={mktg} setMktg={setMktg} />}
        {page === "memo" && <MemoPg memos={memos} setMemos={setMemos} />}
        {page === "tools" && <ToolsPg tools={tools} setTools={setTools} />}
        {page === "dashboard" && (
          <div>

            {/* MONTHS */}
            <div style={{ display: "flex", gap: 3, marginBottom: 12, overflowX: "auto" }}>
              {MONTHS.map((m, i) => {
                const sel = i === selM;
                const cur = i === new Date().getMonth();
                const mc = mC[i];
                return (
                  <button key={m} onClick={() => setSelM(i)} style={{
                    flex: "1 0 auto", minWidth: 54, padding: "5px 3px", textAlign: "center",
                    border: sel ? "2px solid " + A : "2px solid transparent",
                    borderRadius: 10, background: sel ? "#fff" : "rgba(255,255,255,0.6)",
                    cursor: "pointer", position: "relative",
                  }}>
                    {cur && <div style={{ position: "absolute", top: -5, left: "50%", transform: "translateX(-50%)", background: "#E07A5F", color: "#fff", fontSize: 7, padding: "0 4px", borderRadius: 4, fontWeight: 700 }}>NOW</div>}
                    <div style={{ fontSize: 11, fontWeight: sel ? 800 : 500 }}>{m}</div>
                    <div style={{ height: 3, borderRadius: 2, background: "#E5E7EB", marginTop: 3, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: mc.pct + "%", borderRadius: 2, background: mc.pct === 100 ? "#34D399" : mc.pct > 0 ? "#FBBF24" : "transparent" }} />
                    </div>
                    <div style={{ fontSize: 8, color: "#9CA3AF", marginTop: 1 }}>{mc.done}/{mc.total}</div>
                  </button>
                );
              })}
            </div>

            {/* FILTERS */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap", alignItems: "center" }}>
                {[{ v: "all", l: "全部" }, { v: "ref", l: "📘" }, { v: "supp", l: "📙" }].map(f => (
                  <Pill key={f.v} label={f.l} color={f.v === "all" ? "#6B7280" : (PL[f.v] ? PL[f.v].color : "#6B7280")} active={fP === f.v} onClick={() => setFP(f.v)} small />
                ))}
                <span style={{ color: "#D1D5DB" }}>│</span>
                <Pill label="全" color="#6B7280" active={fC === "all"} onClick={() => setFC("all")} small />
                {Object.entries(CATS).map(([k, v]) => (
                  <Pill key={k} label={v.icon} color="#6B7280" active={fC === k} onClick={() => setFC(k)} small />
                ))}
              </div>
              <div style={{ display: "flex", gap: 4 }}>
                <button onClick={() => setShowReport(true)} style={{ background: "#fff", border: "1.5px solid #E5E7EB", borderRadius: 8, padding: "5px 10px", fontSize: 10, fontWeight: 600, cursor: "pointer" }}>📋</button>
                <button onClick={() => setShowClone(true)} style={{ background: "#fff", border: "1.5px solid #E5E7EB", borderRadius: 8, padding: "5px 10px", fontSize: 10, fontWeight: 600, cursor: "pointer" }}>📅</button>
                <button onClick={openNew} style={{ background: A, color: "#fff", border: "none", borderRadius: 8, padding: "5px 12px", fontSize: 10, fontWeight: 700, cursor: "pointer" }}>＋</button>
              </div>
            </div>

            {/* STATS */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 5, marginBottom: 10 }}>
              {[
                { l: "總", v: mSt.total, c: "#374151", bg: "#fff" },
                { l: "完成", v: mSt.done, c: "#059669", bg: "#ECFDF5" },
                { l: "進行", v: mSt.ip, c: "#D97706", bg: "#FFFBEB" },
                { l: "待辦", v: mSt.pd, c: "#9CA3AF", bg: "#F9FAFB" },
              ].map(s => (
                <div key={s.l} style={{ background: s.bg, borderRadius: 8, padding: "6px 8px", textAlign: "center", border: "1px solid #F0F0F0" }}>
                  <div style={{ fontSize: 18, fontWeight: 800, color: s.c }}>{s.v}</div>
                  <div style={{ fontSize: 9, color: "#9CA3AF", fontWeight: 600 }}>{s.l}</div>
                </div>
              ))}
            </div>

            {/* TASK LISTS */}
            {Object.entries(CATS).map(([ck, ci]) => {
              if (fC !== "all" && fC !== ck) return null;
              const items = grouped[ck] || [];
              return (
                <div key={ck} style={{ marginBottom: 12 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 5, paddingBottom: 4, borderBottom: "2px solid #E5E7EB" }}>
                    <span style={{ fontSize: 14 }}>{ci.icon}</span>
                    <span style={{ fontSize: 13, fontWeight: 700 }}>{ci.label}</span>
                    <span style={{ fontSize: 10, fontWeight: 700, background: "#F3F4F6", color: "#6B7280", padding: "1px 6px", borderRadius: 6 }}>{items.length}</span>
                  </div>
                  {items.length === 0 && <div style={{ fontSize: 11, color: "#D1D5DB", textAlign: "center", padding: 6, fontStyle: "italic" }}>無</div>}
                  {items.map(t => <TaskCard key={t.id} task={t} onEdit={tk => { setEditTask(tk); setIsNew(false); }} onToggle={toggle} />)}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* MODALS */}
      {editTask && <TaskEd task={editTask} isNew={isNew} onSave={saveTask} onDel={delTask} onClose={() => { setEditTask(null); setIsNew(false); }} />}
      <ReportMd open={showReport} onClose={() => setShowReport(false)} tasks={tasks} month={selM} />
      <Modal open={showClone} onClose={() => setShowClone(false)} title="📅 複製年度" width={400}>
        <div style={{ textAlign: "center", marginBottom: 16 }}>
          <div style={{ fontSize: 36 }}>📅</div>
          <div style={{ fontSize: 14, fontWeight: 700 }}>複製到新年度</div>
          <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 4 }}>結構+經驗保留，狀態重設</div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
          <button onClick={() => setShowClone(false)} style={{ background: "#F3F4F6", border: "none", borderRadius: 10, padding: "7px 18px", fontSize: 12, fontWeight: 600, cursor: "pointer", color: "#6B7280" }}>取消</button>
          <button onClick={() => {
            setTasks(tasks.map((t, i) => ({
              ...t, id: "tc" + Date.now() + "_" + i, status: "pending",
              subs: t.subs.map((s, si) => ({ ...s, id: "sc" + Date.now() + "_" + si, status: "pending", deadline: "" })),
            })));
            setShowClone(false);
          }} style={{ background: A, color: "#fff", border: "none", borderRadius: 10, padding: "7px 22px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>確認複製</button>
        </div>
      </Modal>
      <DataMd open={showData} onClose={() => setShowData(false)} tasks={tasks} todos={todos} tools={tools} notes={notes} mktg={mktg} memos={memos} setTasks={setTasks} setTodos={setTodos} setTools={setTools} setNotes={setNotes} setMktg={setMktg} setMemos={setMemos} />
      <PaGuide open={showPA} onClose={() => setShowPA(false)} />

      {/* Cloud Sync Modal */}
      <Modal open={showCloud} onClose={() => setShowCloud(false)} title="☁️ 雲端同步設定" width={480}>
        {ghCfg && ghCfg.token ? (
          <div>
            <div style={{ padding: "14px 16px", background: "#ECFDF5", borderRadius: 12, border: "1px solid #A7F3D0", marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                <span style={{ fontSize: 20 }}>☁️✓</span>
                <span style={{ fontSize: 15, fontWeight: 700, color: "#059669" }}>已連線</span>
              </div>
              <div style={{ fontSize: 12, color: "#374151", lineHeight: 1.6 }}>
                帳號：{ghCfg.owner}<br />Repo：{ghCfg.repo}<br />資料會在修改後 3 秒自動同步到雲端
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button onClick={cloudPull} style={{ background: A, color: "#fff", border: "none", borderRadius: 10, padding: "9px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>📥 從雲端下載</button>
              <button onClick={() => { doCloudPush(); alert("手動同步中..."); }} style={{ background: "#fff", border: "1.5px solid " + A, color: A, borderRadius: 10, padding: "9px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>📤 手動上傳</button>
              <button onClick={cloudDisconnect} style={{ background: "#fff", border: "1.5px solid #EF4444", color: "#EF4444", borderRadius: 10, padding: "9px 20px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>中斷連線</button>
            </div>
            <div style={{ marginTop: 14, fontSize: 11, color: "#9CA3AF", lineHeight: 1.6 }}>
              ⚠️ 如果兩台裝置同時編輯，後存的會覆蓋先存的。建議換裝置時先按「📥 從雲端下載」。
            </div>
          </div>
        ) : (
          <div>
            <div style={{ padding: "12px 16px", background: "#F0F9FF", borderRadius: 12, border: "1px solid #BAE6FD", marginBottom: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#0369A1", marginBottom: 4 }}>設定 GitHub 雲端同步</div>
              <div style={{ fontSize: 11, color: "#374151", lineHeight: 1.7 }}>
                設定後，資料會自動存到你的 GitHub repository。<br />公司電腦、家裡電腦、手機打開同一個網址就能同步。
              </div>
            </div>
            <FW><FL>GitHub 帳號名稱</FL><Inp value={ghForm.owner} onChange={e => setGhForm(p => ({ ...p, owner: e.target.value }))} placeholder="例：your-username" /></FW>
            <FW><FL>Repository 名稱</FL><Inp value={ghForm.repo} onChange={e => setGhForm(p => ({ ...p, repo: e.target.value }))} placeholder="例：work-system" /></FW>
            <FW>
              <FL>Personal Access Token（ghp_ 開頭）</FL>
              <Inp type="password" value={ghForm.token} onChange={e => setGhForm(p => ({ ...p, token: e.target.value }))} placeholder="ghp_xxxxxxxxxxxx" />
            </FW>
            <button onClick={cloudSaveConfig} style={{ background: A, color: "#fff", border: "none", borderRadius: 10, padding: "10px 24px", fontSize: 14, fontWeight: 700, cursor: "pointer", width: "100%" }}>連線並同步</button>

            <div style={{ marginTop: 16, padding: "12px 14px", background: "#FEF3C7", borderRadius: 10, border: "1px solid #FDE68A" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#92400E", marginBottom: 4 }}>📌 Token 怎麼取得？</div>
              <div style={{ fontSize: 11, color: "#92400E", lineHeight: 1.8 }}>
                1. 到 github.com → 右上角頭像 → Settings<br />
                2. 左邊最下面 → Developer settings<br />
                3. Personal access tokens → Tokens (classic)<br />
                4. Generate new token (classic)<br />
                5. Note 填「工作系統」，Expiration 選 No expiration<br />
                6. 勾選 repo（第一個勾就好）<br />
                7. 按 Generate token → 複製 ghp_ 開頭的字串
              </div>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
