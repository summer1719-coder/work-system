/* ═══════ GITHUB CLOUD SYNC ═══════ */
const GH_KEY = "wv5_gh";

async function ghLoadCfg() {
  try { const r = await window.storage.get(GH_KEY); return r ? JSON.parse(r.value) : null; } catch { return null; }
}
async function ghSaveCfg(c) { await window.storage.set(GH_KEY, JSON.stringify(c)); }

async function ghPush(cfg, data) {
  const url = "https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/contents/data.json";
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  let sha = null;
  try {
    const g = await fetch(url, { headers: { Authorization: "token " + cfg.token } });
    if (g.ok) sha = (await g.json()).sha;
  } catch (e) {}
  const body = { message: "sync " + new Date().toISOString().slice(0, 16), content: content };
  if (sha) body.sha = sha;
  const r = await fetch(url, {
    method: "PUT",
    headers: { Authorization: "token " + cfg.token, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error("Push " + r.status);
  return true;
}

async function ghPull(cfg) {
  const url = "https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/contents/data.json";
  const r = await fetch(url, { headers: { Authorization: "token " + cfg.token } });
  if (!r.ok) { if (r.status === 404) return null; throw new Error("Pull " + r.status); }
  const j = await r.json();
  return JSON.parse(decodeURIComponent(escape(atob(j.content))));
}

function dlColor(d) {
  if (!d) return null;
  const diff = (new Date(d) - new Date()) / 864e5;
  if (diff < 0) return "#EF4444";
  if (diff < 3) return "#F59E0B";
  return "#6B7280";
}

function Pill({ label, color, active, onClick, small }) {

function Dot({ status, size }) {

}

function IB({ children, onClick, danger, title }) {
  return (
    <button onClick={onClick} title={title} style={{
      background: "none", border: "none", cursor: "pointer",
      padding: "4px 6px", borderRadius: 6, fontSize: 14,
      color: danger ? "#EF4444" : "#9CA3AF",
    }}
      onMouseOver={e => { e.currentTarget.style.background = danger ? "#FEE2E2" : "#F3F4F6"; }}
      onMouseOut={e => { e.currentTarget.style.background = "none"; }}
    >{children}</button>
  );
}

function Modal({ open, onClose, title, children, width }) {
  if (!open) return null;
  const w = width || 580;
  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 1000,
      display: "flex", alignItems: "center", justifyContent: "center", padding: 16,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        background: "#fff", borderRadius: 18, width: "100%", maxWidth: w,
        maxHeight: "90vh", overflow: "auto", boxShadow: "0 20px 60px rgba(0,0,0,0.2)",
      }}>
        <div style={{
          padding: "14px 22px", borderBottom: "1px solid #F3F4F6",
          display: "flex", justifyContent: "space-between", alignItems: "center",
          position: "sticky", top: 0, background: "#fff", zIndex: 2, borderRadius: "18px 18px 0 0",
        }}>
          <h3 style={{ margin: 0, fontSize: 16, fontWeight: 700 }}>{title}</h3>
          <IB onClick={onClose}>✕</IB>
        </div>
        <div style={{ padding: "16px 22px" }}>{children}</div>
      </div>
    </div>
  );
}

function Inp(props) {
  const { style: s, ...rest } = props;
  return <input {...rest} style={{
    width: "100%", padding: "8px 12px", border: "1.5px solid #E5E7EB",
    borderRadius: 10, fontSize: 13, outline: "none", boxSizing: "border-box", ...(s || {}),
  }} />;
}

function Sel({ value, onChange, options, placeholder }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)} style={{
      width: "100%", padding: "8px 12px", border: "1.5px solid #E5E7EB",
      borderRadius: 10, fontSize: 13, outline: "none", background: "#fff",

    }}>
      {placeholder && <option value="">{placeholder}</option>}
      {options.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  );
}

/* ═══════ WEEKLY REMINDER ═══════ */
function buildWeekItems(tasks, todos, notes, mktg, startDate, endDate) {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const list = [];
  tasks.forEach(t => {
    t.subs.forEach(s => {
      if (s.deadline && s.status !== "done") {
        const d = new Date(s.deadline);
        if (d >= startDate && d <= endDate) {
          list.push({ kind: "排程", src: "sub", taskId: t.id, subId: s.id, cat: (CATS[t.category] || {}).icon || "📋", catLabel: (CATS[t.category] || {}).label || "", mainTask: t.title, subTask: s.title, deadline: s.deadline, status: s.status, overdue: d < now });
        }
      }
    });
  });
  (notes || []).forEach(n => {
    if (n.trackDate && !n.tracked) {
      const d = new Date(n.trackDate);
      if (d >= startDate && d <= endDate) {
        list.push({ kind: "備註", src: "note", noteId: n.id, cat: "📒", catLabel: "產品備註", mainTask: n.period + " " + n.product, subTask: n.description.length > 25 ? n.description.slice(0, 25) + "..." : n.description, deadline: n.trackDate, status: "inProgress", overdue: d < now });
      }
    }
  });
  // Marketing logs with dueDate
  (mktg || []).forEach(m => {
    (m.logs || []).forEach(l => {
      if (l.dueDate && l.status !== "done") {
        const d = new Date(l.dueDate);
        if (d >= startDate && d <= endDate) {
          list.push({ kind: "行銷", src: "mktg-log", stratId: m.id, logId: l.id, cat: "📣", catLabel: m.name, mainTask: m.name, subTask: l.text.length > 30 ? l.text.slice(0, 30) + "..." : l.text, deadline: l.dueDate, status: l.status === "active" ? "inProgress" : "pending", overdue: d < now });
        }
      }
    });
  });
  return list;
}

function WeeklyReminder({ tasks, todos, notes, mktg, setTasks, setTodos, setNotes, setMktg }) {
  const [showNext, setShowNext] = React.useState(false);

  const now = new Date(); now.setHours(0, 0, 0, 0);
  const weekEnd = new Date(now);
  weekEnd.setDate(now.getDate() + (7 - now.getDay()));
  const nextWeekStart = new Date(weekEnd);
  nextWeekStart.setDate(nextWeekStart.getDate() + 1);
  const nextWeekEnd = new Date(nextWeekStart);
  nextWeekEnd.setDate(nextWeekEnd.getDate() + 6);

  const thisWeekSubs = React.useMemo(() => buildWeekItems(tasks, todos, notes, mktg, now, weekEnd), [tasks, todos, notes, mktg]);
  const nextWeekSubs = React.useMemo(() => buildWeekItems(tasks, todos, notes, mktg, nextWeekStart, nextWeekEnd), [tasks, todos, notes, mktg]);

  // Add current-month in-progress tasks (no deadline) to this week only
  const thisWeekItems = React.useMemo(() => {
    const list = [...thisWeekSubs];
    const cm = now.getMonth();
    tasks.filter(t => t.month === cm && t.status === "inProgress").forEach(t => {
      if (!list.some(x => x.mainTask === t.title)) {
        list.push({ kind: "排程", src: "main", taskId: t.id, cat: (CATS[t.category] || {}).icon || "📋", catLabel: (CATS[t.category] || {}).label || "", mainTask: t.title, subTask: "—", deadline: "", status: "inProgress", overdue: false });
      }
    });
    todos.filter(t => !t.done).slice(0, 6).forEach(t => {
      list.push({ kind: "待辦", src: "todo", todoId: t.id, linkedTaskId: t.linkedTaskId, todoText: t.text, cat: "📝", catLabel: "待辦事項", mainTask: t.project || "零碎待辦", subTask: t.text, deadline: "", status: "pending", overdue: false });
    });
    return list.slice(0, 15);
  }, [thisWeekSubs, tasks, todos]);

  const handleCheck = (it) => {
    if (it.src === "sub") {
      setTasks(prev => prev.map(t => {
        if (t.id !== it.taskId) return t;
        const ns = t.subs.map(s => s.id === it.subId ? { ...s, status: "done" } : s);
        const allDone = ns.length > 0 && ns.every(s => s.status === "done");
        return { ...t, subs: ns, status: allDone ? "done" : t.status };
      }));
    } else if (it.src === "main") {
      setTasks(prev => prev.map(t =>
        t.id === it.taskId ? { ...t, status: "done", subs: t.subs.map(s => ({ ...s, status: "done" })) } : t
      ));
    } else if (it.src === "todo") {
      setTodos(prev => prev.map(td => td.id === it.todoId ? { ...td, done: true } : td));
      if (it.linkedTaskId) {
        setTasks(prev => prev.map(t => {
          if (t.id !== it.linkedTaskId) return t;
          const ns = t.subs.map(s => s.title === it.todoText ? { ...s, status: "done" } : s);
          const allDone = ns.length > 0 && ns.every(s => s.status === "done");
          return { ...t, subs: ns, status: allDone ? "done" : t.status };
        }));
      }
    } else if (it.src === "note" && setNotes) {
      setNotes(prev => prev.map(n => n.id === it.noteId ? { ...n, tracked: true } : n));
    } else if (it.src === "mktg-log" && setMktg) {
      setMktg(prev => prev.map(m => {
        if (m.id !== it.stratId) return m;
        return { ...m, logs: (m.logs || []).map(l => l.id === it.logId ? { ...l, status: "done", done: true } : l) };
      }));
    }
  };

  if (thisWeekItems.length === 0 && nextWeekSubs.length === 0) return null;
  const overdueCount = thisWeekItems.filter(x => x.overdue).length;

  return (
    <div style={{ marginBottom: 16 }}>
      {/* This week */}
      {thisWeekItems.length > 0 && (
        <div style={{ background: "#fff", borderRadius: 14, padding: "14px 18px", marginBottom: 8, border: overdueCount > 0 ? "1.5px solid #FECACA" : "1.5px solid #DBEAFE" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
            <span style={{ fontSize: 18 }}>⏰</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: "#1E40AF" }}>本週提醒</span>
            <span style={{ fontSize: 10, color: "#93C5FD", fontWeight: 600 }}>{thisWeekItems.length} 項</span>
            {overdueCount > 0 && (
              <span style={{ fontSize: 10, fontWeight: 700, padding: "1px 8px", borderRadius: 8, background: "#FEE2E2", color: "#DC2626" }}>{overdueCount} 項逾期</span>
            )}
          </div>
          <ReminderTable items={thisWeekItems} handleCheck={handleCheck} label="本週子項目" />
        </div>
      )}

      {/* Next week */}
      {nextWeekSubs.length > 0 && (
        <div style={{ background: "#fff", borderRadius: 14, padding: "14px 18px", border: "1.5px solid #E0E7FF" }}>
          <button onClick={() => setShowNext(!showNext)} style={{
            display: "flex", alignItems: "center", gap: 6, background: "none",
            border: "none", cursor: "pointer", padding: 0, width: "100%",
          }}>
            <span style={{ fontSize: 16 }}>📅</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: "#4338CA" }}>下週預覽</span>
            <span style={{ fontSize: 10, color: "#A5B4FC", fontWeight: 600 }}>{nextWeekSubs.length} 項</span>
            <span style={{ fontSize: 10, color: "#A5B4FC", marginLeft: 4 }}>進度超前可先完成</span>
            <span style={{ marginLeft: "auto", fontSize: 12, color: "#A5B4FC", transform: showNext ? "rotate(90deg)" : "rotate(0)", transition: "transform .15s" }}>▶</span>
          </button>
          {showNext && (
            <div style={{ marginTop: 10 }}>
              <ReminderTable items={nextWeekSubs} handleCheck={handleCheck} label="下週子項目" />
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ═══════ TODO PAGE ═══════ */
function TodoPg({ todos, setTodos, tasks, setTasks }) {
  const [input, setInput] = React.useState("");
  const [editId, setEditId] = React.useState(null);
  const [ef, setEf] = React.useState({});

  const taskOpts = React.useMemo(() => {
    return [{ v: "", l: "── 不歸屬 ──" }, ...tasks.map(t => ({ v: t.id, l: MONTHS[t.month] + " ┃ " + t.title }))];
  }, [tasks]);

  const add = () => {
    if (!input.trim()) return;
    setTodos(p => [...p, { id: "td" + Date.now(), text: input.trim(), done: false, project: "", url: "", aiTool: null, linkedTaskId: "", createdAt: new Date().toISOString().slice(0, 10) }]);
    setInput("");
  };
  const toggle = (id) => {
    const todo = todos.find(t => t.id === id);
    if (!todo) return;
    const newDone = !todo.done;
    // Update the todo itself
    setTodos(p => p.map(t => t.id === id ? { ...t, done: newDone } : t));
    // Sync back to linked task's sub-item
    if (todo.linkedTaskId) {
      setTasks(prev => prev.map(t => {
        if (t.id !== todo.linkedTaskId) return t;
        const newSubs = t.subs.map(s => {
          if (s.title === todo.text) {
            return { ...s, status: newDone ? "done" : "pending" };
          }
          return s;
        });
        // Also check if all subs are done → mark parent as done
        const allDone = newSubs.length > 0 && newSubs.every(s => s.status === "done");
        const anyInProgress = newSubs.some(s => s.status === "inProgress");
        let parentStatus = t.status;
        if (allDone) parentStatus = "done";
        else if (newDone === false && t.status === "done") parentStatus = "inProgress";
        return { ...t, subs: newSubs, status: parentStatus };
      }));
    }
  };
  const rm = (id) => setTodos(p => p.filter(t => t.id !== id));

  const saveEdit = () => {
    if (ef.linkedTaskId) {
      const prev = todos.find(t => t.id === editId);
      if (!prev || prev.linkedTaskId !== ef.linkedTaskId) {
        setTasks(pr => pr.map(t => {
          if (t.id !== ef.linkedTaskId) return t;
          if (t.subs.some(s => s.title === ef.text)) return t;
          return { ...t, subs: [...t.subs, { id: "std" + Date.now(), title: ef.text, status: ef.done ? "done" : "pending", aiTool: ef.aiTool, note: "來自待辦", url: ef.url || "", deadline: "" }] };
        }));
      }
    }
    setTodos(p => p.map(t => t.id === editId ? ef : t));
    setEditId(null);
  };

  const active = todos.filter(t => !t.done);
  const done = todos.filter(t => t.done);

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
        <Inp value={input} onChange={e => setInput(e.target.value)} placeholder="快速新增待辦..." onKeyDown={e => e.key === "Enter" && add()} style={{ flex: 1 }} />
        <button onClick={add} style={{ background: A, color: "#fff", border: "none", borderRadius: 10, padding: "8px 18px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>＋</button>
      </div>

      <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8 }}>進行中 ({active.length})</div>
      {active.length === 0 && <div style={{ fontSize: 12, color: "#D1D5DB", textAlign: "center", padding: 20, fontStyle: "italic" }}>沒有待辦 🎉</div>}
      {active.map(td => {
        const lk = td.linkedTaskId ? tasks.find(x => x.id === td.linkedTaskId) : null;
        const lkName = lk ? (MONTHS[lk.month] + "—" + lk.title) : null;
        return (
          <div key={td.id} style={{ background: "#fff", borderRadius: 10, padding: "10px 14px", marginBottom: 5, border: "1px solid #F0F0F0", display: "flex", alignItems: "center", gap: 10 }}>
            <input type="checkbox" checked={false} onChange={() => toggle(td.id)} style={{ cursor: "pointer", width: 16, height: 16, accentColor: A, flexShrink: 0 }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 600 }}>{td.text}</div>
              <div style={{ display: "flex", gap: 5, marginTop: 3, flexWrap: "wrap" }}>
                {lkName && <span style={{ fontSize: 9, fontWeight: 600, padding: "1px 6px", borderRadius: 6, background: "#DBEAFE", color: "#1D4ED8" }}>📌 {lkName}</span>}
                {td.project && <span style={{ fontSize: 9, fontWeight: 600, padding: "1px 6px", borderRadius: 6, background: "#EDE9FE", color: "#7C3AED" }}>📂 {td.project}</span>}

  const add = () => {
    setEf({ id: "tl" + Date.now(), name: "", purpose: "", url: "", aiTool: null, tags: "", category: "other", createdAt: new Date().toISOString().slice(0, 10) });

  };
  const rm = (id) => setTools(p => p.filter(t => t.id !== id));

  const filtered = tools.filter(t => {
    if (filterCat !== "all" && (t.category || "other") !== filterCat) return false;
    if (search) {
      const s = search.toLowerCase();
      return (t.name + t.purpose + t.tags + (t.aiTool || "") + (t.category || "")).toLowerCase().includes(s);
    }
    return true;
  });

  // Group by category for display

        <FW><FL>網址</FL><Inp value={ef.url || ""} onChange={e => setEf(p => ({ ...p, url: e.target.value }))} placeholder="https://..." /></FW>
        <FW><FL>AI 平台</FL><AiPick value={ef.aiTool} onChange={v => setEf(p => ({ ...p, aiTool: v }))} /></FW>

/* ═══════ REPORT + CLONE + DATA ═══════ */
function ReportMd({ open, onClose, tasks, month }) {
  const [dlUrl, setDlUrl] = React.useState(null);
  const [dlName, setDlName] = React.useState("");
  const mt = tasks.filter(t => t.month === month);
  const nxt = tasks.filter(t => t.month === (month + 1) % 12);
  const d = mt.filter(t => t.status === "done");
  const ip = mt.filter(t => t.status === "inProgress");
  const pd = mt.filter(t => t.status === "pending");
  const fm = t => (t.product === "both" ? "[參+補]" : t.product === "ref" ? "[參]" : "[補]") + " " + t.title;

  const txt = React.useMemo(() => {
    let r = "115年 " + MONTHS[month] + " 月報\n";
    r += "報告日期：" + new Date().toISOString().slice(0, 10) + "\n";
    r += "────────────────────\n";
    r += "總" + mt.length + " 完成" + d.length + " 進行" + ip.length + " 待處理" + pd.length + "\n";
    if (d.length) { r += "\n【完成】\n"; d.forEach(t => { r += "  ✓ " + fm(t) + "\n"; }); }
    if (ip.length) { r += "\n【進行中】\n"; ip.forEach(t => { r += "  ▸ " + fm(t) + "\n"; t.subs.filter(s => s.status !== "done").forEach(s => { r += "    - " + s.title + (s.deadline ? " (" + s.deadline + ")" : "") + "\n"; }); }); }
    if (pd.length) { r += "\n【待處理】\n"; pd.forEach(t => { r += "  ○ " + fm(t) + "\n"; }); }
    if (nxt.length) { r += "\n【下月 " + MONTHS[(month + 1) % 12] + "】\n"; nxt.forEach(t => { r += "  → " + fm(t) + "\n"; }); }
    return r;
  }, [mt, d, ip, pd, nxt, month]);

  // Group tasks by category for Excel format
  const catGroups = React.useMemo(() => {
    const groups = {};
    mt.forEach(t => {
      const catLabel = t.product === "both" ? "共通/其他"
        : t.product === "ref" ? "參考書銷售"
        : "補充銷售";
      if (!groups[catLabel]) groups[catLabel] = [];

      // Build progress description
      let progress = "";
      if (t.subs.length > 0) {
        progress = t.subs.map((s, i) => {
          let line = (i + 1) + "." + s.title;
          if (s.status === "done") line += "（已完成）";
          return line;
        }).join("\n");
      } else {
        progress = STM[t.status].label;
      }

      // Determine deadline text
      let deadlineText = "";
      const activeSubs = t.subs.filter(s => s.deadline);
      if (activeSubs.length > 0) {
        const latest = activeSubs.sort((a, b) => b.deadline.localeCompare(a.deadline))[0];
        deadlineText = latest.deadline;
      }

      groups[catLabel].push({
        title: t.title,
        deadline: deadlineText,
        completed: t.status === "done" ? new Date().toISOString().slice(0, 10) : "",
        progress: progress,
      });
    });
    return groups;
  }, [mt]);

  const dlXlsx = () => {
    // Generate Excel XML Spreadsheet
    const today = new Date();
    const yy = today.getFullYear() - 1911;
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    const dateStr = yy + mm + dd;

    const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/\n/g, "&#10;");

    let rows = [];

    // Header row
    rows.push({
      cells: [
        { val: "營一處行企部行企組重要工作追蹤表（更新日期：" + dateStr + "）", merge: 6, style: "header" },
      ],
    });

    // Column headers
    rows.push({
      cells: [
        { val: "類別", style: "colHead" },
        { val: "內容", style: "colHead" },
        { val: "配合\n單位", style: "colHead" },
        { val: "預定\n完成日期", style: "colHead" },
        { val: "實際\n完成日", style: "colHead" },
        { val: "進度說明", style: "colHead" },
      ],
    });

    // Data rows grouped by category
    Object.entries(catGroups).forEach(([catLabel, items]) => {
      items.forEach((item, idx) => {
        rows.push({
          cells: [
            { val: idx === 0 ? catLabel : "", style: idx === 0 ? "catFirst" : "cat" },
            { val: item.title, style: "content" },
            { val: "", style: "content" },
            { val: item.deadline, style: "content" },
            { val: item.completed, style: "content" },
            { val: item.progress, style: "progress" },
          ],
        });
      });
    });

    // Next month section
    if (nxt.length > 0) {
      rows.push({
        cells: [
          { val: "下月追蹤\n" + MONTHS[(month + 1) % 12], merge: 6, style: "nextMonth" },
        ],
      });
      nxt.forEach(t => {
        const prod = t.product === "both" ? "共通" : t.product === "ref" ? "參考書" : "補充";
        rows.push({
          cells: [
            { val: prod, style: "cat" },
            { val: t.title, style: "content" },
            { val: "", style: "content" },
            { val: "", style: "content" },
            { val: "", style: "content" },
            { val: "", style: "progress" },
          ],
        });
      });
    }

    // Build XML
    let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
    xml += '<?mso-application progid="Excel.Sheet"?>\n';
    xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"\n';
    xml += ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';

    // Styles
    xml += '<Styles>\n';
    xml += '<Style ss:ID="Default"><Font ss:FontName="Microsoft JhengHei" ss:Size="12"/><Alignment ss:Vertical="Center" ss:WrapText="1"/></Style>\n';
    xml += '<Style ss:ID="header"><Font ss:FontName="Times New Roman" ss:Size="18" ss:Bold="1"/><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/></Style>\n';
    xml += '<Style ss:ID="colHead"><Font ss:FontName="Times New Roman" ss:Size="12" ss:Bold="1"/><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/><Borders><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="2"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>\n';
    xml += '<Style ss:ID="catFirst"><Font ss:FontName="Microsoft JhengHei" ss:Size="12" ss:Bold="1"/><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>\n';
    xml += '<Style ss:ID="cat"><Font ss:FontName="Microsoft JhengHei" ss:Size="12"/><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>\n';
    xml += '<Style ss:ID="content"><Font ss:FontName="Microsoft JhengHei" ss:Size="12"/><Alignment ss:Horizontal="Left" ss:Vertical="Center" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>\n';
    xml += '<Style ss:ID="progress"><Font ss:FontName="Microsoft JhengHei" ss:Size="12"/><Alignment ss:Horizontal="Left" ss:Vertical="Center" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
    xml += '<Style ss:ID="nextMonth"><Font ss:FontName="Times New Roman" ss:Size="14" ss:Bold="1"/><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/><Interior ss:Color="#DBEAFE" ss:Pattern="Solid"/></Style>\n';
    xml += '</Styles>\n';

    xml += '<Worksheet ss:Name="瑋育">\n';
    xml += '<Table ss:DefaultRowHeight="36">\n';
    xml += '<Column ss:Width="100"/>\n';  // A
    xml += '<Column ss:Width="180"/>\n';  // B
    xml += '<Column ss:Width="80"/>\n';   // C
    xml += '<Column ss:Width="100"/>\n';  // D
    xml += '<Column ss:Width="80"/>\n';   // E
    xml += '<Column ss:Width="500"/>\n';  // F

    rows.forEach(row => {
      xml += '<Row ss:AutoFitHeight="1">\n';
      row.cells.forEach(cell => {
        const styleAttr = cell.style ? ' ss:StyleID="' + cell.style + '"' : '';
        const mergeAttr = cell.merge ? ' ss:MergeAcross="' + (cell.merge - 1) + '"' : '';
        xml += '<Cell' + styleAttr + mergeAttr + '>';
        xml += '<Data ss:Type="String">' + esc(cell.val) + '</Data>';
        xml += '</Cell>\n';
      });
      xml += '</Row>\n';
    });

    xml += '</Table>\n</Worksheet>\n</Workbook>';

    const blob = new Blob([xml], { type: "application/vnd.ms-excel" });
    const url = URL.createObjectURL(blob);
    const fname = "行企組重要工作進度追蹤表" + yy + mm.padStart(2, "0") + ".xls";
    setDlUrl(url);
    setDlName(fname);
    // Try auto download
    try {
      const a = document.createElement("a");
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch (err) { /* fallback link shown below */ }
  };

  return (
    <Modal open={open} onClose={onClose} title={"📋 " + MONTHS[month] + " 月報"} width={620}>
      <pre style={{ background: "#FAFAFA", border: "1px solid #E5E7EB", borderRadius: 12, padding: 14, fontSize: 12, lineHeight: 1.7, whiteSpace: "pre-wrap", maxHeight: 300, overflow: "auto", fontFamily: F }}>{txt}</pre>
      <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
        <button onClick={(e) => { e.stopPropagation(); navigator.clipboard.writeText(txt); }} style={{ background: "#fff", border: "1.5px solid #E5E7EB", borderRadius: 10, padding: "8px 16px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>📋 複製文字</button>
        <button onClick={(e) => { e.stopPropagation(); dlXlsx(); }} style={{ background: "#059669", color: "#fff", border: "none", borderRadius: 10, padding: "8px 16px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
          📥 下載 Excel（追蹤表格式）
        </button>
      </div>
      {dlUrl && (
        <div style={{ marginTop: 10, padding: "10px 14px", background: "#ECFDF5", borderRadius: 10, border: "1px solid #A7F3D0" }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#059669", marginBottom: 4 }}>✓ 檔案已產生</div>
          <a href={dlUrl} download={dlName} target="_blank" rel="noreferrer"
            style={{ fontSize: 13, fontWeight: 700, color: "#059669", textDecoration: "underline", cursor: "pointer" }}
            onClick={e => e.stopPropagation()}>
            📥 點此下載：{dlName}
          </a>
        </div>
      )}
      <div style={{ marginTop: 10, padding: "10px 12px", background: "#F0F9FF", borderRadius: 8, border: "1px solid #BAE6FD", fontSize: 11, color: "#374151", lineHeight: 1.6 }}>
        💡 Excel 檔格式與「行企組重要工作進度追蹤表」相同：類別 / 內容 / 配合單位 / 預定完成日 / 實際完成日 / 進度說明。用 Excel 開啟後可直接編輯微調。
      </div>
    </Modal>

}

function DataMd({ open, onClose, tasks, todos, tools, notes, mktg, memos, setTasks, setTodos, setTools, setNotes, setMktg, setMemos }) {
  const exp = () => {
    const d = JSON.stringify({ tasks, todos, tools, notes, mktg, memos, v: "v5" }, null, 2);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([d], { type: "application/json" }));
    a.download = "備份_" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
  };
  const imp = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = (ev) => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.tasks) setTasks(d.tasks);
        if (d.todos) setTodos(d.todos);
        if (d.tools) setTools(d.tools);
        if (d.notes) setNotes(d.notes);
        if (d.mktg) setMktg(d.mktg);
        if (d.memos) setMemos(d.memos);
        alert("匯入成功！");
        onClose();
      } catch (err) { alert("格式錯誤"); }
    };
    r.readAsText(f);
  };

  return (
    <Modal open={open} onClose={onClose} title="💾 資料管理" width={460}>
      <FW>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 6 }}>匯出</div>
        <button onClick={exp} style={{ background: A, color: "#fff", border: "none", borderRadius: 10, padding: "9px 22px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>📥 下載 JSON</button>
      </FW>
      <div style={{ borderTop: "1px solid #F3F4F6", paddingTop: 14 }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 6 }}>匯入</div>
        <label style={{ display: "inline-block", background: "#fff", border: "1.5px solid #E5E7EB", borderRadius: 10, padding: "9px 22px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
          📤 選檔<input type="file" accept=".json" onChange={imp} style={{ display: "none" }} />
        </label>
      </div>
      <div style={{ marginTop: 16, padding: "12px 14px", background: "#F0FDF4", borderRadius: 10, border: "1px solid #BBF7D0", fontSize: 11, color: "#374151", lineHeight: 1.7 }}>
        <b>現在：</b>同帳號可讀。<b>建議：</b>定期備份。<b>改版：</b>新對話→貼碼改→匯入。
      </div>
    </Modal>
  );
}

function ProductNotesPg({ notes, setNotes, setTodos }) {
  const [subTab, setSubTab] = React.useState("product");
  const [editId, setEditId] = React.useState(null);
  const [ef, setEf] = React.useState({});
  const [filterType, setFilterType] = React.useState("all");
  const [filterPeriod, setFilterPeriod] = React.useState("all");
  const [filterProdCat, setFilterProdCat] = React.useState("all");
  const [search, setSearch] = React.useState("");

  const curNotes = notes.filter(n => (n.category || "product") === subTab);

  const add = () => {
    setEf({
      id: "pn" + Date.now(), category: subTab,
      period: "115(一)", prodCat: "ref", product: "",
      noteType: "temporary", description: "",
      createdAt: new Date().toISOString().slice(0, 10),
      trackDate: "", tracked: false,
    });
    setEditId("new");
  };

  const saveEdit = () => {
    const item = { ...ef, category: ef.category || subTab };
    if (editId === "new") {
      setNotes(p => [...p, item]);
      if (item.trackDate) {
        const tabLabel = (NOTE_TABS.find(t => t.id === subTab) || {}).l || "備註";
        setTodos(p => [...p, {
          id: "td-pn" + Date.now(),
          text: "【" + tabLabel.slice(2) + "追蹤】" + item.product + "：" + (item.description.length > 25 ? item.description.slice(0, 25) + "..." : item.description),
          done: false,
          project: tabLabel.slice(2) + " " + item.period,
          url: "", aiTool: null, linkedTaskId: "",
          createdAt: new Date().toISOString().slice(0, 10),
        }]);
      }
    } else {
      setNotes(p => p.map(n => n.id === editId ? item : n));
    }
    setEditId(null);
  };

  const rm = (id) => setNotes(p => p.filter(n => n.id !== id));
  const toggleTracked = (id) => setNotes(p => p.map(n => n.id === id ? { ...n, tracked: !n.tracked } : n));

  const filtered = curNotes.filter(n => {
    if (filterType !== "all" && n.noteType !== filterType) return false;
    if (filterPeriod !== "all" && n.period !== filterPeriod) return false;
    if (filterProdCat !== "all" && n.prodCat !== filterProdCat) return false;
    if (search && !(n.product + n.description).toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const permCount = curNotes.filter(n => n.noteType === "permanent").length;
  const tempCount = curNotes.filter(n => n.noteType === "temporary").length;
  const pendingTrack = curNotes.filter(n => n.trackDate && !n.tracked).length;

  return (
    <div>
      {/* Sub-tabs */}
      <div style={{ display: "flex", gap: 4, marginBottom: 14, borderBottom: "2px solid #E5E7EB", paddingBottom: 8 }}>
        {NOTE_TABS.map(tab => {
          const count = notes.filter(n => (n.category || "product") === tab.id).length;
          const pending = notes.filter(n => (n.category || "product") === tab.id && n.trackDate && !n.tracked).length;
          return (
            <button key={tab.id} onClick={() => { setSubTab(tab.id); setFilterType("all"); setFilterPeriod("all"); setFilterProdCat("all"); setSearch(""); }}
              style={{
                background: subTab === tab.id ? "#fff" : "transparent",
                border: subTab === tab.id ? "1.5px solid " + A : "1.5px solid transparent",
                borderRadius: 10, padding: "7px 14px", fontSize: 12, fontWeight: subTab === tab.id ? 700 : 500,
                cursor: "pointer", color: subTab === tab.id ? A : "#6B7280",
                display: "flex", alignItems: "center", gap: 5,
                boxShadow: subTab === tab.id ? "0 2px 6px rgba(0,0,0,0.06)" : "none",
              }}>
              <span>{tab.icon}</span>
              <span>{tab.l.slice(2)}</span>
              {count > 0 && <span style={{ fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 6, background: "#F3F4F6", color: "#6B7280" }}>{count}</span>}
              {pending > 0 && <span style={{ fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 6, background: "#FEE2E2", color: "#DC2626" }}>{pending}</span>}
            </button>
          );
        })}
      </div>

      {/* Stats */}
      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
        <div style={{ background: "#E0F2FE", borderRadius: 10, padding: "6px 12px", display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ fontSize: 14 }}>🔄</span>
          <div><div style={{ fontSize: 15, fontWeight: 800, color: "#0369A1" }}>{permCount}</div><div style={{ fontSize: 8, color: "#0369A1" }}>常態</div></div>
        </div>
        <div style={{ background: "#FEF3C7", borderRadius: 10, padding: "6px 12px", display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ fontSize: 14 }}>⚡</span>
          <div><div style={{ fontSize: 15, fontWeight: 800, color: "#B45309" }}>{tempCount}</div><div style={{ fontSize: 8, color: "#B45309" }}>臨時</div></div>
        </div>
        {pendingTrack > 0 && (
          <div style={{ background: "#FEE2E2", borderRadius: 10, padding: "6px 12px", display: "flex", alignItems: "center", gap: 5 }}>
            <span style={{ fontSize: 14 }}>📅</span>
            <div><div style={{ fontSize: 15, fontWeight: 800, color: "#DC2626" }}>{pendingTrack}</div><div style={{ fontSize: 8, color: "#DC2626" }}>待追蹤</div></div>
          </div>
        )}
      </div>

      {/* Filters */}
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap", alignItems: "center" }}>
        <Inp value={search} onChange={e => setSearch(e.target.value)} placeholder="🔍 搜尋..." style={{ flex: 1, minWidth: 140 }} />
        <Sel value={filterPeriod} onChange={v => setFilterPeriod(v)} options={[{ v: "all", l: "全部期別" }, ...PERIODS.map(p => ({ v: p, l: p }))]} />
        <Sel value={filterProdCat} onChange={v => setFilterProdCat(v)} options={[{ v: "all", l: "全部類別" }, ...PROD_CATS.map(c => ({ v: c.v, l: c.l }))]} />
        <div style={{ display: "flex", gap: 3 }}>
          <Pill label="全" color="#6B7280" active={filterType === "all"} onClick={() => setFilterType("all")} small />
          <Pill label="🔄 常態" color="#0369A1" active={filterType === "permanent"} onClick={() => setFilterType("permanent")} small />
          <Pill label="⚡ 臨時" color="#B45309" active={filterType === "temporary"} onClick={() => setFilterType("temporary")} small />
        </div>
        <button onClick={add} style={{ background: A, color: "#fff", border: "none", borderRadius: 10, padding: "8px 16px", fontSize: 12, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>＋ 新增</button>
      </div>

      {/* List */}
      {filtered.length === 0 && (
        <div style={{ textAlign: "center", padding: 40, color: "#D1D5DB" }}>
          <div style={{ fontSize: 36, marginBottom: 8 }}>{(NOTE_TABS.find(t => t.id === subTab) || {}).icon || "📒"}</div>
          <div style={{ fontSize: 13 }}>尚無備註，點「新增」開始記錄</div>
        </div>
      )}
      {filtered.map(note => (
        <NoteCard key={note.id} note={note}
          onEdit={n => { setEf({ ...n }); setEditId(n.id); }}
          onDelete={rm}
          onToggleTrack={toggleTracked} />
      ))}

      {/* Editor */}
      <NoteEditor
        open={!!editId} onClose={() => setEditId(null)}
        ef={ef} setEf={setEf}
        onSave={saveEdit} onDelete={rm}
        isNew={editId === "new"} tabId={subTab} />
    </div>
  );
}
